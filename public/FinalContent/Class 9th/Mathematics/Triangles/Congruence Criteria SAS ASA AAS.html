<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Congruence Criteria (SAS, ASA, AAS) - Interactive Learning</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --triangle-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --congruence-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            background: var(--triangle-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            max-height: 600px;
        }

        .stage-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            padding: 5px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .demo-btn.active {
            background: var(--triangle-gradient);
            color: white;
            border-color: transparent;
        }

        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--triangle-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        .math-title {
            font-size: 1.3rem;
            margin-top: 0px;
            margin-bottom: 10px;
            color: var(--text-accent);
            text-align: center;
            font-weight: 600;
        }

        .math-description {
            font-size: 1rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 900px;
            margin: 0 auto 10px auto;
            line-height: 1.6;
            padding: 8px;
        }

        .content-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            margin: 6px 0;
            backdrop-filter: blur(10px);
        }

        .formula-box {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            margin: 8px 0;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .formula {
            font-size: 1.1rem;
            color: var(--text-accent);
            font-weight: 600;
        }

        .value-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-accent);
            text-align: center;
            margin: 15px 0;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin: 10px 0;
        }

        .grid-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin: 15px 0;
        }

        .info-box {
            background: var(--glass-bg);
            border-left: 4px solid var(--text-accent);
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
        }

        .highlight {
            color: var(--text-accent);
            font-weight: 600;
        }

        .triangle-svg {
            max-width: 100%;
            height: auto;
        }

        .congruence-symbol {
            font-size: 1.5rem;
            color: var(--text-accent);
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 6px 0;
            color: var(--text-secondary);
            position: relative;
            padding-left: 20px;
        }

        li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--text-accent);
            font-weight: bold;
        }

        .example-box {
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.1) 0%, rgba(56, 249, 215, 0.1) 100%);
            border: 2px solid rgba(67, 233, 123, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        .note-box {
            background: linear-gradient(135deg, rgba(250, 112, 154, 0.1) 0%, rgba(254, 225, 64, 0.1) 100%);
            border: 2px solid rgba(250, 112, 154, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        .warning-box {
            background: linear-gradient(135deg, rgba(255, 59, 59, 0.1) 0%, rgba(255, 153, 102, 0.1) 100%);
            border: 2px solid rgba(255, 59, 59, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        .proof-step {
            background: var(--glass-bg);
            border-left: 3px solid var(--text-accent);
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .grid-2col, .grid-3col {
                grid-template-columns: 1fr;
            }

            .math-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Basic Congruence Criteria</h1>
        <p>Master SAS, ASA, and AAS Congruence Rules with Interactive Visualizations</p>
    </div>

    <div id="audio-control">
        <button class="control-btn" id="mute-btn">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="main-container">
        <div class="demo-stage">
            <div class="stage-content" id="content"></div>
        </div>

        <div class="controls">
            <button class="demo-btn" data-demo="complete">📚 Complete Lesson</button>
            <button class="demo-btn" data-demo="sas">📏 SAS Rule</button>
            <button class="demo-btn" data-demo="sas-example1">📝 SAS Example 1</button>
            <button class="demo-btn" data-demo="sas-example2">📝 SAS Example 2</button>
            <button class="demo-btn" data-demo="asa">📐 ASA Rule</button>
            <button class="demo-btn" data-demo="aas">🔺 AAS Rule</button>
            <button class="demo-btn" data-demo="aas-example">📝 AAS Example</button>
            <button class="demo-btn" data-demo="practice">💪 Practice Problem</button>
            <button class="demo-btn" data-demo="reset">🔄 Reset</button>
        </div>
    </div>

    <script>
        // Global variables
        let currentDemo = null;
        let globalAudioEnabled = true;
        let currentTeacher = null;

        // Text-to-Speech Teacher
        function createNewTeacher() {
            if (currentTeacher) {
                currentTeacher.stop();
            }

            const teacher = {
                isEnabled: globalAudioEnabled,
                currentUtterance: null,
                
                speak(text, onComplete) {
                    if (!this.isEnabled || !window.speechSynthesis) {
                        if (onComplete) setTimeout(onComplete, 500);
                        return;
                    }
                    
                    this.stop();
                    
                    this.currentUtterance = new SpeechSynthesisUtterance(text);
                    this.currentUtterance.rate = 0.9;
                    this.currentUtterance.pitch = 1;
                    this.currentUtterance.volume = 1;
                    
                    if (onComplete) {
                        this.currentUtterance.onend = () => {
                            setTimeout(onComplete, 1000);
                        };
                    }
                    
                    window.speechSynthesis.speak(this.currentUtterance);
                },
                
                stop() {
                    if (window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                    }
                }
            };
            
            currentTeacher = teacher;
            return teacher;
        }

        // Content transition
        function transitionToNextStep(content) {
            const contentDiv = document.getElementById('content');
            contentDiv.style.animation = 'fadeIn 0.5s ease-out forwards';
            contentDiv.innerHTML = content;
        }

        // SVG Triangle Generator
        function createTriangle(vertices, labels, showSides = true, sideLabels = [], color = '#4facfe', showAngles = false) {
            const [A, B, C] = vertices;
            const points = `${A[0]},${A[1]} ${B[0]},${B[1]} ${C[0]},${C[1]}`;
            
            let svg = `
                <svg width="350" height="280" viewBox="0 0 350 280" class="triangle-svg">
                    <polygon points="${points}" 
                             fill="none" 
                             stroke="${color}" 
                             stroke-width="3"
                             opacity="0">
                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
                    </polygon>
            `;

            // Vertex labels
            labels.forEach((label, i) => {
                const vertex = vertices[i];
                let offsetX = 0, offsetY = -15;
                if (i === 1) { offsetX = -15; offsetY = 15; }
                if (i === 2) { offsetX = 15; offsetY = 15; }
                
                svg += `
                    <text x="${vertex[0] + offsetX}" y="${vertex[1] + offsetY}" 
                          fill="${color}" font-size="18" font-weight="bold" 
                          text-anchor="middle" opacity="0">
                        ${label}
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                    </text>
                `;
            });

            // Side labels
            if (showSides && sideLabels.length > 0) {
                sideLabels.forEach(([label, pos]) => {
                    svg += `
                        <text x="${pos[0]}" y="${pos[1]}" 
                              fill="#43e97b" font-size="14" font-weight="600" 
                              text-anchor="middle" opacity="0">
                            ${label}
                            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
                        </text>
                    `;
                });
            }

            // Angle arcs if requested
            if (showAngles) {
                svg += `
                    <path d="M ${B[0]+20},${B[1]} A 20 20 0 0 0 ${B[0]},${B[1]-20}" 
                          fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
                    </path>
                    <text x="${B[0]+12}" y="${B[1]-8}" fill="#fbbf24" font-size="12" opacity="0">
                        50°
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
                    </text>
                `;
            }

            svg += `</svg>`;
            return svg;
        }

        // Complete Lesson
        function showCompleteLesson() {
            let step = 0;
            const teacher = createNewTeacher();
            
            const steps = [
                {
                    content: `
                        <h2 class="math-title">Welcome to Congruence Criteria! ✨</h2>
                        <div class="value-display">Interactive Learning</div>
                        <div class="math-description">
                            Master the three fundamental rules for proving triangle congruence 
                            with interactive visualizations!
                        </div>
                        <div class="grid-3col" style="max-width: 900px; margin: 20px auto;">
                            <div class="formula-box">
                                <p class="formula" style="color: #4facfe;">SAS</p>
                                <p style="color: #e2e8f0; margin-top: 5px; font-size: 0.9rem;">Side-Angle-Side</p>
                            </div>
                            <div class="formula-box">
                                <p class="formula" style="color: #43e97b;">ASA</p>
                                <p style="color: #e2e8f0; margin-top: 5px; font-size: 0.9rem;">Angle-Side-Angle</p>
                            </div>
                            <div class="formula-box">
                                <p class="formula" style="color: #f5576c;">AAS</p>
                                <p style="color: #e2e8f0; margin-top: 5px; font-size: 0.9rem;">Angle-Angle-Side</p>
                            </div>
                        </div>
                    `,
                    narration: "Welcome to Basic Congruence Criteria! In this lesson, you'll learn the three fundamental rules for proving triangle congruence: SAS or Side-Angle-Side, ASA or Angle-Side-Angle, and AAS or Angle-Angle-Side."
                },
                {
                    content: `
                <h2 class="math-title" style="font-size: 1.1rem; margin-bottom: 8px;">2.1 SAS Congruence Rule 📏</h2>
                <div class="content-card" style="max-width: 1000px; margin: 0 auto; padding: 8px;">
                    <h3 class="highlight" style="margin-bottom: 6px; text-align: center; font-size: 0.95rem;">Statement (Axiom 7.1)</h3>
                    <p style="color: #e2e8f0; text-align: center; font-size: 0.85rem; line-height: 1.4;">
                        Two triangles are congruent if <span class="highlight">two sides</span> and the 
                        <span class="highlight">included angle</span> of one triangle are equal to two sides 
                        and the included angle of the other triangle.
                    </p>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 1000px; margin: 10px auto;">
                    <div>
                        <h3 style="color: #4facfe; text-align: center; margin-bottom: 6px; font-size: 0.9rem;">△ABC</h3>
                        <svg width="280" height="220" viewBox="0 0 280 220" style="max-width: 100%;">
                            <polygon points="140,30 80,180 200,180" 
                                     fill="none" 
                                     stroke="#4facfe" 
                                     stroke-width="3"

                                <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
                            </polygon>
                            <text x="140" y="20" fill="#4facfe" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                A
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="70" y="195" fill="#4facfe" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                B
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="210" y="195" fill="#4facfe" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                C
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="105" y="100" fill="#43e97b" font-size="12" font-weight="600" text-anchor="middle" opacity="0">
                                AB=2cm
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
                            </text>
                            <text x="140" y="200" fill="#43e97b" font-size="12" font-weight="600" text-anchor="middle" opacity="0">
                                BC=4cm
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
                            </text>
                            <path d="M 100,180 A 20 20 0 0 0 91,164" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
                            </path>
                            <text x="105" y="172" fill="#fbbf24" font-size="11" opacity="0">
                                50°
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
                            </text>
                        </svg>
                    </div>
                    <div>
                        <h3 style="color: #43e97b; text-align: center; margin-bottom: 6px; font-size: 0.9rem;">△PQR</h3>
                        <svg width="280" height="220" viewBox="0 0 280 220" style="max-width: 100%;">
                            <polygon points="140,30 80,180 200,180" 
                                     fill="none" 
                                     stroke="#43e97b" 
                                     stroke-width="3"
                                     opacity="0">
                                <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
                            </polygon>
                            <text x="140" y="20" fill="#43e97b" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                P
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="70" y="195" fill="#43e97b" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                Q
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="210" y="195" fill="#43e97b" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                R
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
                            </text>
                            <text x="105" y="100" fill="#43e97b" font-size="12" font-weight="600" text-anchor="middle" opacity="0">
                                PQ=2cm
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
                            </text>
                            <text x="140" y="200" fill="#43e97b" font-size="12" font-weight="600" text-anchor="middle" opacity="0">
                                QR=4cm
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
                            </text>
                            <path d="M 100,180 A 20 20 0 0 0 91,164" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
                            </path>
                            <text x="105" y="172" fill="#fbbf24" font-size="11" opacity="0">

                                <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>

                </div>
                <div class="formula-box" style="max-width: 700px; margin: 8px auto; padding: 8px;">

                </div>
                <div class="warning-box" style="max-width: 800px; margin: 8px auto; padding: 8px;">
                    <p style="color: #ff3b3b; font-weight: 600; margin-bottom: 3px; font-size: 0.9rem;">⚠️ Important:</p>
                    <p style="color: #e2e8f0; font-size: 0.85rem;">
                        The angle MUST be between the two equal sides. SSA or ASS does NOT work!
                    </p>
                </div>
                    `,
                    narration: "The SAS rule states that two triangles are congruent if two sides and the included angle of one triangle are equal to two sides and the included angle of the other triangle. The key word is included - the angle must be between the two equal sides. In this example, AB equals PQ at 2 centimeters, BC equals QR at 4 centimeters, and the angle at B equals the angle at Q at 50 degrees. Therefore, triangle ABC is congruent to triangle PQR by SAS. Remember, SSA or ASS does not work because the angle is not between the sides!"
                },
                {
                    content: `
                        <h2 class="math-title">⚠️ Important Warning about SAS</h2>
                        <div class="grid-2col" style="max-width: 1200px; margin: 10px auto;">
                            <div class="warning-box">
                                <h3 style="color: #ff3b3b; margin-bottom: 8px; text-align: center; font-size: 1rem;">

                                </h3>

                                        • Angle: 50° (NOT between sides)<br>

                            • Side EF = 5 cm<br><br>

            teacher.speak("The AAS rule, or Angle-Angle-Side, states that two triangles are congruent if any two pairs of angles and one pair of corresponding sides are equal. But why does this work? Remember, the sum of angles in a triangle is always 180 degrees. If two pairs of angles are equal between triangles, the third pair must also be equal automatically. So AAS essentially becomes ASA! For example, if triangle ABC has angle A equals 50 degrees, angle B equals 60 degrees, and side BC equals 5 centimeters, and triangle DEF has angle D equals 50 degrees, angle E equals 60 degrees, and side EF equals 5 centimeters, then angle C and angle F both equal 70 degrees automatically. Therefore, triangle ABC is congruent to triangle DEF by AAS, which becomes ASA.");

                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;

                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'sas':
                            showSAS();
                            break;
                        case 'sas-example1':
                            showSASExample1();
                            break;
                        case 'sas-example2':
                            showSASExample2();
                            break;
                        case 'asa':
                            showASA();
                            break;
                        case 'aas':
                            showAAS();
                            break;
                        case 'aas-example':
                            showAASExample();
                            break;
                        case 'practice':
                            showPractice();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });

            // Audio control
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);

                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }

                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });
        });
    </script>
</body>
</html>
