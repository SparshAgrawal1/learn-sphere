<!DOCTYPE html>
<html lang="en">
<head>

            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {

            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);

        .header h1 {

            background: var(--equation-gradient);

            -webkit-background-clip: text;

            font-size: 0.9rem;

        }

            flex: 1;
            display: flex;
            flex-direction: column;

            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;

            overflow-y: auto;
            overflow-x: hidden;

            align-items: flex-start;

            max-height: 600px;

        .demo-stage::-webkit-scrollbar {

        }

            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(-20px); }

            border-radius: 20px;

        .quiz-option {

        .quiz-option.incorrect {

            background: var(--glass-bg);

            color: white;

        .interactive-input {

            border: 2px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 1.1rem;
            text-align: center;
            width: 100%;
            margin: 10px 0;
        }

        .interactive-input:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .term-btn {
            background: var(--primary-gradient);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 10px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .term-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
            background: var(--accent-gradient);
        }

        .term-btn:active {
            transform: translateY(-1px) scale(1.02);
        }
    </style>
</head>
<body>
    <div id="audio-control">
        <button id="mute-btn" class="control-btn">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="header">
        <h1>📊 Types and Degrees of Polynomials 📊</h1>
        <p>Interactive Learning Experience | Mathematics Made Visual</p>
    </div>

    <div class="main-container">
        <div class="demo-stage">
            <div id="stage-content" class="stage-content active"></div>
        </div>

        <div class="controls">
            <button class="demo-btn" data-demo="complete">📚 Complete Lesson</button>
            <button class="demo-btn" data-demo="by-terms">🔢 Classification by Terms</button>
            <button class="demo-btn" data-demo="monomials">1️⃣ Monomials</button>
            <button class="demo-btn" data-demo="binomials">2️⃣ Binomials</button>
            <button class="demo-btn" data-demo="trinomials">3️⃣ Trinomials</button>
            <button class="demo-btn" data-demo="by-degree">📈 Classification by Degree</button>
            <button class="demo-btn" data-demo="linear">📏 Linear Polynomials</button>
            <button class="demo-btn" data-demo="quadratic">📐 Quadratic Polynomials</button>
            <button class="demo-btn" data-demo="cubic">📦 Cubic Polynomials</button>
            <button class="demo-btn" data-demo="finding-degree">🔍 Finding Degree</button>
            <button class="demo-btn" data-demo="visualization">📊 Visualization</button>
            <button class="demo-btn" data-demo="interactive">🎮 Interactive Demo</button>
            <button class="demo-btn" data-demo="quiz">🏆 Quiz Time</button>
            <button class="demo-btn" data-demo="reset">🔄 Reset</button>
        </div>
    </div>

    <script>
        let globalAudioEnabled = true;
        let currentTeacher = null;
        let currentDemo = null;
        let quizScore = 0;
        let currentQuizQuestion = 0;

        // Text-to-Speech Teacher
        class Teacher {
            constructor() {
                this.synthesis = window.speechSynthesis;
                this.isEnabled = globalAudioEnabled;
                this.currentUtterance = null;
            }

            speak(text) {
                if (!this.isEnabled || !this.synthesis) return;

                this.stop();

                this.currentUtterance = new SpeechSynthesisUtterance(text);
                this.currentUtterance.rate = 0.9;
                this.currentUtterance.pitch = 1;
                this.currentUtterance.volume = 1;

                const voices = this.synthesis.getVoices();
                const preferredVoice = voices.find(voice => 
                    voice.lang.startsWith('en') && voice.name.includes('Female')
                ) || voices.find(voice => voice.lang.startsWith('en')) || voices[0];

                if (preferredVoice) {
                    this.currentUtterance.voice = preferredVoice;
                }

                this.synthesis.speak(this.currentUtterance);
            }

            stop() {
                if (this.synthesis) {
                    this.synthesis.cancel();
                }
            }
        }

        function createNewTeacher() {
            if (currentTeacher) {
                currentTeacher.stop();
            }
            currentTeacher = new Teacher();
            return currentTeacher;
        }

        function transitionToNextStep(content) {
            const stageContent = document.getElementById('stage-content');
            stageContent.style.animation = 'fadeOut 0.3s ease-out';
            
            setTimeout(() => {
                stageContent.innerHTML = content;
                stageContent.style.animation = 'fadeIn 0.5s ease-out';
            }, 300);
        }

        function stopCurrentDemo() {
            if (currentTeacher) {
                currentTeacher.stop();
            }
        }

        // Complete Lesson
        function showCompleteLesson() {
            stopCurrentDemo();
            const teacher = createNewTeacher();
            let step = 0;

            const steps = [
                {
                    content: `
                        <h2 class="math-title">Welcome! 🎉</h2>
                        <div class="value-display">Types & Degrees of Polynomials</div>
                        <div class="math-description">
                            Learn how to classify polynomials by their terms and degrees!
                        </div>
                        <div class="formula-box">
                            <p style="font-size: 1.2rem; color: #43e97b;">
                                ✓ Monomials, Binomials, Trinomials<br>
                                ✓ Linear, Quadratic, Cubic<br>
                                ✓ Finding Degrees
                            </p>
                        </div>
                        <button class="action-btn" onclick="nextStep()">Start Learning →</button>
                    `,
                    speech: "Welcome! Let's explore the fascinating world of polynomial types and degrees. We'll learn how to classify polynomials and identify their characteristics."
                },
                {
                    content: `
                        <h2 class="math-title" style="font-size: 1.4rem; margin-bottom: 12px;">Classification by Terms 🔢</h2>
                        <div style="width: 100%; padding: 0 20px;">
                            <div class="comparison-grid">
                                <div class="content-card" style="padding: 15px; margin: 0;">
                                    <h3 style="color: #667eea; font-size: 1.2rem; margin-bottom: 12px;">Monomial</h3>
                                    <p style="color: #e2e8f0; margin-bottom: 12px; font-size: 0.95rem;">
                                        <span class="highlight-text">One term</span>
                                    </p>
                                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
                                        <span class="type-badge monomial-badge" style="font-size: 0.95rem; padding: 8px 14px;">2x</span>
                                        <span class="type-badge monomial-badge" style="font-size: 0.95rem; padding: 8px 14px;">5x³</span>
                                        <span class="type-badge monomial-badge" style="font-size: 0.95rem; padding: 8px 14px;">y⁴</span>
                                    </div>
                                </div>
                                <div class="content-card" style="padding: 15px; margin: 0;">
                                    <h3 style="color: #4facfe; font-size: 1.2rem; margin-bottom: 12px;">Binomial</h3>
                                    <p style="color: #e2e8f0; margin-bottom: 12px; font-size: 0.95rem;">
                                        <span class="highlight-text">Two terms</span>
                                    </p>
                                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
                                        <span class="type-badge binomial-badge" style="font-size: 0.95rem; padding: 8px 14px;">x + 1</span>
                                        <span class="type-badge binomial-badge" style="font-size: 0.95rem; padding: 8px 14px;">x² - x</span>
                                    </div>
                                </div>
                                <div class="content-card" style="padding: 15px; margin: 0;">
                                    <h3 style="color: #fa709a; font-size: 1.2rem; margin-bottom: 12px;">Trinomial</h3>
                                    <p style="color: #e2e8f0; margin-bottom: 12px; font-size: 0.95rem;">

                        <button class="action-btn" onclick="nextStep()">Continue →</button>

                    speech: "Polynomials can be classified by the number of terms. A monomial has one term like 2x or 5x cubed. A binomial has two terms like x plus 1. A trinomial has three terms like x plus x squared plus pi."
                },
                {
                    content: `
                        <h2 class="math-title" style="font-size: 1.4rem; margin-bottom: 12px;">Classification by Degree 📈</h2>
                        <div style="width: 100%; padding: 0 20px;">
                            <div class="math-description" style="font-size: 1rem; margin-bottom: 15px;">

                                <p style="color: #e2e8f0; font-size: 0.9rem;">Examples: 4x + 5, 2y, t + √2</p>
                            </div>
                            <div class="content-card" style="padding: 15px; margin: 10px 0;">
                                <h3 style="color: #4facfe; font-size: 1.2rem; margin-bottom: 10px;">Quadratic (Degree 2)</h3>
                                <p class="formula" style="font-size: 1.2rem; margin: 8px 0;">ax² + bx + c, a ≠ 0</p>
                                <p style="color: #e2e8f0; font-size: 0.9rem;">Examples: 2x² + 5, x² + 2x/5</p>
                            </div>
                            <div class="content-card" style="padding: 15px; margin: 10px 0;">
                                <h3 style="color: #f5576c; font-size: 1.2rem; margin-bottom: 10px;">Cubic (Degree 3)</h3>
                                <p class="formula" style="font-size: 1.2rem; margin: 8px 0;">ax³ + bx² + cx + d, a ≠ 0</p>
                                <p style="color: #e2e8f0; font-size: 0.9rem;">Examples: 4x³, 2x³ + 4x² + 6x + 7</p>
                            </div>
                        </div>
                        <button class="action-btn" onclick="nextStep()">Continue →</button>
                    `,
                    speech: "Polynomials are also classified by their degree, which is the highest power of the variable. Linear polynomials have degree 1, quadratic polynomials have degree 2, and cubic polynomials have degree 3. Let's explore each type in detail."
                },
                {
                    content: `
                        <h2 class="math-title" style="font-size: 1.4rem; margin-bottom: 12px;">Linear Polynomials 📏</h2>
                        <div style="width: 100%; padding: 0 20px;">

                                    <p style="margin: 10px 0; color: #e2e8f0;">
                                        <span class="highlight-text">• Slope:</span> Coefficient 'a'
                                    </p>
                                    <p style="margin: 10px 0; color: #e2e8f0;">
                                        <span class="highlight-text">• Y-intercept:</span> Constant 'b'
                                    </p>
                                </div>
                            </div>
                            <div class="example-box" style="padding: 15px; margin: 12px 0;">
                                <h4 style="color: #43e97b; font-size: 1rem; margin-bottom: 10px;">Examples:</h4>
                                <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
                                    <span class="degree-badge" style="font-size: 0.95rem; padding: 6px 12px;">4x + 5</span>
                                    <span class="degree-badge" style="font-size: 0.95rem; padding: 6px 12px;">2y</span>
                                    <span class="degree-badge" style="font-size: 0.95rem; padding: 6px 12px;">-3x + 7</span>
                                </div>
                            </div>
                        </div>
                        <button class="action-btn" onclick="nextStep()">Next →</button>
                    `,
                    speech: "Linear polynomials have degree 1 and take the form ax plus b, where a is not equal to zero. They graph as straight lines. The coefficient a is the slope, and b is the y-intercept. Examples include 4x plus 5, 2y, and negative 3x plus 7."
                },

                    </div>
                    <div id="classification-result" style="margin-top: 15px;"></div>
                </div>
            `;

            transitionToNextStep(content);

            let polyTerms = [];
            let waitingForOperator = false;

            window.addTermWithCoeff = function(power) {
                const coeffInput = document.getElementById('coeff-input');
                let coeff = coeffInput.value.trim();
                
                // If no coefficient entered, default to 1
                if (coeff === '' || coeff === '+') {
                    coeff = '1';
                } else if (coeff === '-') {
                    coeff = '-1';
                }
                
                // Build the term
                let term;
                if (power === '1') {
                    // Constant term
                    term = coeff;
                } else {
                    // Remove coefficient of 1 for cleaner display
                    if (coeff === '1') {
                        term = power;
                    } else if (coeff === '-1') {
                        term = '-' + power;
                    } else {
                        term = coeff + power;
                    }
                }
                
                if (!waitingForOperator) {
                    polyTerms.push(term);
                    waitingForOperator = true;
                    updateDisplay();
                    coeffInput.value = ''; // Clear input after adding
                }
            };

            window.addOperator = function(op) {
                if (waitingForOperator && polyTerms.length > 0) {
                    polyTerms.push(op);
                    waitingForOperator = false;
                    updateDisplay();
                }
            };

            window.clearPolynomial = function() {
                polyTerms = [];
                waitingForOperator = false;
                document.getElementById('poly-display').textContent = '(empty)';
                document.getElementById('classification-result').innerHTML = '';
                document.getElementById('coeff-input').value = '';
            };

            function updateDisplay() {
                const display = polyTerms.join(' ');
                document.getElementById('poly-display').textContent = display || '(empty)';
            }

            window.classifyBuiltPolynomial = function() {
                if (polyTerms.length === 0) {
                    teacher.speak("Please build a polynomial first by entering a coefficient and selecting a power term!");
                    return;
                }

                // Count terms (operators separate terms)
                const termCount = polyTerms.filter(t => t !== '+' && t !== '-').length;
                
                let termType = '';
                if (termCount === 1) termType = 'Monomial';
                else if (termCount === 2) termType = 'Binomial';
                else if (termCount === 3) termType = 'Trinomial';
                else termType = 'Polynomial';

                // Find highest degree - improved parsing
                let degree = 0;
                polyTerms.forEach(term => {
                    if (term === '+' || term === '-') return;
                    
                    if (term.includes('x³') || term.includes('³')) {
                        degree = Math.max(degree, 3);
                    } else if (term.includes('x²') || term.includes('²')) {
                        degree = Math.max(degree, 2);
                    } else if (term.includes('x') && !term.includes('²') && !term.includes('³')) {
                        degree = Math.max(degree, 1);
                    }
                    // If term doesn't contain x, it's a constant (degree 0)
                });

                let degreeType = '';
                if (degree === 0) degreeType = 'Constant';
                else if (degree === 1) degreeType = 'Linear';
                else if (degree === 2) degreeType = 'Quadratic';
                else if (degree === 3) degreeType = 'Cubic';
                else degreeType = `Degree ${degree}`;

                const result = `
                    <div class="content-card glow-effect" style="padding: 15px;">
                        <h3 style="color: #fbbf24; font-size: 1.2rem; margin-bottom: 12px;">Classification Results:</h3>
                        <p style="font-size: 1rem; color: #e2e8f0; margin: 10px 0;">
                            <span class="highlight-text">By Terms:</span> ${termType} (${termCount} term${termCount > 1 ? 's' : ''})
                        </p>
                        <p style="font-size: 1rem; color: #e2e8f0; margin: 10px 0;">
                            <span class="highlight-text">By Degree:</span> ${degreeType} (Degree ${degree})
                        </p>
                        <div style="margin-top: 15px; text-align: center;">
                            <span class="type-badge ${termType.toLowerCase()}-badge">${termType}</span>
                            <span class="degree-badge">${degreeType}</span>
                        </div>
                    </div>
                `;

                document.getElementById('classification-result').innerHTML = result;
                
                // Smooth scroll to show the results
                setTimeout(() => {
                    const resultsElement = document.getElementById('classification-result');
                    if (resultsElement) {
                        resultsElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }, 100);
                
                teacher.speak(`Your polynomial is a ${termType} with degree ${degree}, making it a ${degreeType} polynomial.`);
            };

            setTimeout(() => {
                teacher.speak("Build your own polynomial by entering a coefficient in the input field, then clicking on a power term like x cubed, x squared, or x. Use plus or minus to combine terms. When you're done, click classify to see the results!");
            }, 500);
        }

                <div class="value-display">Interactive Learning</div>
                <div class="math-description">
                    Explore polynomial types and degrees with stunning animations 
                    and interactive visualizations!
                </div>
                <div class="formula-box">
                    <p style="font-size: 1.2rem; color: #43e97b;">
                        Monomials | Binomials | Trinomials<br>
                        Linear | Quadratic | Cubic
                    </p>
                </div>
            `;

            transitionToNextStep(content);

            document.querySelectorAll('.demo-btn').forEach(btn => btn.classList.remove('active'));
            currentDemo = null;

            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome back! Choose any lesson to explore polynomial types and degrees!");
            }, 500);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            const teacher = createNewTeacher();

            const initialContent = `
                <h2 class="math-title">Welcome! ✨</h2>
                <div class="value-display">Types & Degrees of Polynomials</div>
                <div class="math-description">
                    Experience mathematics like never before! Learn about polynomial 
                    classification with stunning animations and interactive demos!
                </div>
                <div class="formula-box">
                    <p style="font-size: 1.2rem; color: #43e97b;">
                        Monomials | Binomials | Trinomials<br>
                        Linear | Quadratic | Cubic
                    </p>
                </div>
            `;

            transitionToNextStep(initialContent);

            setTimeout(() => {
                teacher.speak("Welcome to Types and Degrees of Polynomials! Discover how to classify polynomials by their terms and degrees with amazing visualizations!");
            }, 500);

            // Button handlers
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;

                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'by-terms':
                            showByTerms();
                            break;
                        case 'monomials':
                            showMonomials();
                            break;
                        case 'binomials':
                            showBinomials();
                            break;
                        case 'trinomials':
                            showTrinomials();
                            break;
                        case 'by-degree':
                            showByDegree();
                            break;
                        case 'linear':
                            showLinear();
                            break;
                        case 'quadratic':
                            showQuadratic();
                            break;
                        case 'cubic':
                            showCubic();
                            break;
                        case 'finding-degree':
                            showFindingDegree();
                            break;
                        case 'visualization':
                            showVisualization();
                            break;
                        case 'interactive':
                            showInteractiveDemo();
                            break;
                        case 'quiz':
                            showQuiz();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });

            // Audio control
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);

                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }

                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });
        });
    </script>
</body>
</html>
