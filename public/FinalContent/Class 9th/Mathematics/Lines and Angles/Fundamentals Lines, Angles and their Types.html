<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lines & Angles - Master Geometry Fundamentals</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .stage-content {
            width: 100%;
            height: 100%;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .stage-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .demo-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        .chart-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-accent);
            text-align: center;
            font-weight: 600;
        }

        .value-display {
            font-size: 2rem;
            font-weight: bold;
            background: var(--success-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .canvas-container {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            margin: 20px 0;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #geometry-canvas {
            width: 100%;
            height: 100%;
            border-radius: 15px;
        }

        .definition-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #4facfe;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            max-width: 700px;
        }

        .definition-box h3 {
            color: var(--text-accent);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .definition-box p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 1rem;
        }

        .angle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 20px 0;
        }

        .angle-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .angle-card:hover {
            transform: translateY(-5px);
            border-color: var(--text-accent);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }

        .angle-card h4 {
            color: var(--text-accent);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .angle-card canvas {
            width: 100%;
            height: 150px;
            margin: 10px 0;
        }

        .angle-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .quiz-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .quiz-question {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: var(--text-primary);
            text-align: center;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .quiz-option {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.1rem;
            text-align: center;
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: rgba(67, 233, 123, 0.3);
            border-color: #43e97b;
        }

        .quiz-option.incorrect {
            background: rgba(245, 87, 108, 0.3);
            border-color: #f5576c;
        }

        .builder-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .builder-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .builder-control label {
            flex: 0 0 120px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .builder-control input,
        .builder-control select {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .builder-control input[type="range"] {
            cursor: pointer;
        }

        .applications-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 20px 0;
        }

        .application-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .application-card:hover {
            transform: translateY(-5px);
            border-color: var(--text-accent);
        }

        .application-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .application-card h4 {
            color: var(--text-accent);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .application-card p {
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .three-canvas {
            width: 100%;
            height: 400px;
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .angle-grid,
            .applications-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="audio-control">
        <button id="mute-btn" class="control-btn" title="Mute/Unmute">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="header">
        <h1>Lines & Angles Mastery</h1>
        <p>Building Blocks: Understanding Geometry Fundamentals</p>
    </div>

    <div class="main-container">
        <div class="demo-stage" id="demo-stage">
            <div class="stage-content active">
                <h2 class="chart-title">Welcome to Geometry Fundamentals!</h2>
                <div class="value-display">Let's Begin!</div>
                <p style="text-align: center; max-width: 600px; margin-top: 20px;">
                    Lines and angles are the foundation of geometry. Choose a lesson below to start your journey into the world of shapes and measurements!
                </p>
            </div>
        </div>

        <div class="controls">
            <button class="demo-btn" data-demo="complete">📚 Complete Story</button>
            <button class="demo-btn" data-demo="definitions">📏 Basic Definitions</button>
            <button class="demo-btn" data-demo="angles">📐 What is an Angle?</button>
            <button class="demo-btn" data-demo="types">🔺 Types of Angles</button>
            <button class="demo-btn" data-demo="pairs">🔄 Special Angle Pairs</button>
            <button class="demo-btn" data-demo="realworld">🌍 Real-life Applications</button>
            <button class="demo-btn" data-demo="quiz">❓ Quiz Time</button>
            <button class="demo-btn" data-demo="builder">🔧 Angle Builder</button>
            <button class="demo-btn" data-demo="reset">🔄 Reset</button>
        </div>
    </div>

    <script>
        // Global Variables
        let currentTeacher = null;
        let currentDemo = null;
        let globalAudioEnabled = true;
        let charts = {};
        let animationTimeouts = [];
        let isPlaying = false;
        let currentDemoAborted = false;
        let currentRunId = 0;
        let currentTaskId = null;

        // Teacher Voice System
        class TeacherVoice {
            constructor() {
                this.synth = window.speechSynthesis;
                this.voice = null;
                this.rate = 0.8;
                this.pitch = 1.0;
                this.volume = 0.9;
                this.isEnabled = true;
                this.currentUtterance = null;
                this.isDestroyed = false;
                this.setupVoice();
            }

            setupVoice() {
                const loadVoices = () => {
                    const voices = this.synth.getVoices();
                    // Prefer British female voice as specified in memories
                    this.voice = voices.find(v => v.name.includes('Samantha')) ||
                                 voices.find(v => v.lang.includes('en-GB') && v.name.includes('Female')) ||
                                 voices.find(v => v.lang.includes('en') && v.name.includes('Female')) ||
                                 voices.find(v => v.lang.includes('en'));
                };
                loadVoices();
                this.synth.onvoiceschanged = loadVoices;
            }

            async speak(text, delay = 0) {
                if (!this.isEnabled || !globalAudioEnabled || !text || this.isDestroyed) return;
                
                return new Promise((resolve) => {
                    setTimeout(() => {
                        if (this.isDestroyed) {
                            resolve();
                            return;
                        }
                        this.stop();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.voice = this.voice;
                        utterance.rate = this.rate;
                        utterance.pitch = this.pitch;
                        utterance.volume = this.volume;
                        
                        utterance.onend = resolve;
                        utterance.onerror = resolve;
                        
                        this.currentUtterance = utterance;
                        this.synth.speak(utterance);
                    }, delay);
                });
            }

            stop() {
                this.synth.cancel();
                this.currentUtterance = null;
            }

            destroy() {
                this.isDestroyed = true;
                this.stop();
                this.currentUtterance = null;
            }
        }

        // State management functions
        function stopCurrentDemo() {
            currentDemoAborted = true;
            currentRunId++;
            currentTaskId = null;
            
            if (currentTeacher) {
                currentTeacher.destroy();
                currentTeacher = null;
            }
            
            animationTimeouts.forEach(timeout => clearTimeout(timeout));
            animationTimeouts = [];
            
            clearStage();
            isPlaying = false;
        }

        function shouldContinue(taskId = null) {
            if (taskId && currentTaskId && taskId !== currentTaskId) {
                return false;
            }
            return !currentDemoAborted;
        }

        function createNewTeacher(taskId = null) {
            if (currentTeacher) {
                currentTeacher.destroy();
                currentTeacher = null;
            }
            currentDemoAborted = false;
            currentTaskId = taskId;
            currentTeacher = new TeacherVoice();
            currentTeacher.isEnabled = globalAudioEnabled;
            return currentTeacher;
        }

        function wait(ms) {
            return new Promise(resolve => {
                const timeout = setTimeout(resolve, ms);
                animationTimeouts.push(timeout);
            });
        }

        // Clear stage
        function clearStage() {
            const stage = document.getElementById('demo-stage');
            stage.innerHTML = '';
            
            // Clear all timeouts
            animationTimeouts.forEach(timeout => clearTimeout(timeout));
            animationTimeouts = [];
        }

        // Create stage content
        function createStageContent() {
            clearStage();
            const content = document.createElement('div');
            content.className = 'stage-content active';
            document.getElementById('demo-stage').appendChild(content);
            return content;
        }

        // Canvas Drawing Functions
        function drawLine(canvas, x1, y1, x2, y2, color = '#4facfe', animated = true, showLabels = false) {
            if (!canvas) {
                console.error('Canvas not found');
                return;
            }
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Could not get canvas context');
                return;
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            if (animated) {
                let progress = 0;
                let animationId;
                const animate = () => {
                    if (progress <= 1) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(
                            x1 + (x2 - x1) * progress,
                            y1 + (y2 - y1) * progress
                        );
                        ctx.stroke();
                        
                        // Show labels during animation if requested
                        if (showLabels && progress > 0.3) {
                            // Draw endpoint circles
                            ctx.fillStyle = '#43e97b';
                            ctx.beginPath();
                            ctx.arc(x1, y1, 5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(x2, y2, 5, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Draw labels with background
                            ctx.fillStyle = '#000000';
                            ctx.fillRect(x1 - 12, y1 - 25, 24, 20);
                            ctx.fillRect(x2 - 12, y2 - 25, 24, 20);
                            
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 20px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('A', x1, y1 - 10);
                            ctx.fillText('B', x2, y2 - 10);
                            ctx.textAlign = 'left';
                        }
                        
                        progress += 0.02;
                        animationId = requestAnimationFrame(animate);
                    }
                };
                animate();
                
                // Store animation ID for cleanup
                return () => {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                    }
                };
            } else {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                return null;
            }
        }

        function drawLineSegment(canvas, x1, y1, x2, y2) {
            if (!canvas) {
                console.error('Canvas not found for drawLineSegment');
                return;
            }
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Could not get canvas context');
                return;
            }
            
            // Draw line with labels during animation
            const cleanup = drawLine(canvas, x1, y1, x2, y2, '#4facfe', true, true);
            
            return cleanup;
        }

        function drawRay(canvas, x1, y1, x2, y2) {
            const ctx = canvas.getContext('2d');
            
            // Extend the line beyond the endpoint
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const extendX = x2 + (dx / length) * 50;
            const extendY = y2 + (dy / length) * 50;
            
            // Draw the ray with labels during animation
            let progress = 0;
            let animationId;
            const animate = () => {
                if (progress <= 1) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw the ray line
                    ctx.strokeStyle = '#f093fb';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(
                        x1 + (extendX - x1) * progress,
                        y1 + (extendY - y1) * progress
                    );
                    ctx.stroke();
                    
                    // Show labels and endpoints during animation
                    if (progress > 0.3) {
                // Draw starting point
                ctx.fillStyle = '#43e97b';
                ctx.beginPath();
                ctx.arc(x1, y1, 5, 0, Math.PI * 2);
                ctx.fill();
                
                        // Draw arrow at the end when line is mostly drawn
                        if (progress > 0.8) {
                const angle = Math.atan2(dy, dx);
                ctx.fillStyle = '#f093fb';
                ctx.beginPath();
                ctx.moveTo(extendX, extendY);
                ctx.lineTo(
                    extendX - 15 * Math.cos(angle - Math.PI / 6),
                    extendY - 15 * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    extendX - 15 * Math.cos(angle + Math.PI / 6),
                    extendY - 15 * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fill();
                        }
                        
                        // Draw labels with background
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(x1 - 12, y1 - 25, 24, 20);
                        ctx.fillRect(x2 - 12, y2 - 25, 24, 20);
                        
                ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('A', x1, y1 - 10);
                        ctx.fillText('B', x2, y2 - 10);
                        ctx.textAlign = 'left';
                    }
                    
                    progress += 0.02;
                    animationId = requestAnimationFrame(animate);
                }
            };
            animate();
            
            return () => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            };
        }

        function drawAngle(canvas, angle, label = '', color = '#4facfe') {
            return new Promise((resolve) => {
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.35; // Increased radius for better visibility
                
                // Enable high DPI rendering for crisp pixels
                const devicePixelRatio = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * devicePixelRatio;
                canvas.height = rect.height * devicePixelRatio;
                ctx.scale(devicePixelRatio, devicePixelRatio);
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
                // Draw vertex point with better precision
            ctx.fillStyle = '#43e97b';
            ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
            ctx.fill();
            
                // Animate angle opening with improved smoothness and faster speed
            let currentAngle = 0;
                let animationId;
                let animationComplete = false;
                const totalFrames = Math.max(30, angle * 1.2); // Reduced frames for faster animation
                const angleIncrement = angle / totalFrames; // Percentage-based increment
                
            const animate = () => {
                if (currentAngle <= angle) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                        // Draw rays with improved line quality
                    ctx.strokeStyle = color;
                        ctx.lineWidth = 4; // Increased line width for better visibility
                        ctx.lineCap = 'round'; // Rounded line caps for smoother appearance
                        ctx.lineJoin = 'round';
                    
                    // First ray (horizontal)
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(centerX + radius, centerY);
                    ctx.stroke();
                    
                        // Second ray (rotating) with sub-pixel precision
                    const radians = (currentAngle * Math.PI) / 180;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(
                        centerX + radius * Math.cos(radians),
                        centerY - radius * Math.sin(radians)
                    );
                    ctx.stroke();
                    
                        // Draw arc with improved quality
                    ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 3; // Increased arc width
                        ctx.lineCap = 'round';
                    ctx.beginPath();
                        ctx.arc(centerX, centerY, radius * 0.4, 0, -radians, true);
                    ctx.stroke();
                    
                        // Draw vertex point with better visibility
                    ctx.fillStyle = '#43e97b';
                    ctx.beginPath();
                        ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                        // Draw label with improved positioning and anti-aliasing
                    ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 18px Arial'; // Slightly smaller for better fit
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const labelAngle = currentAngle / 2;
                        const labelRadians = (labelAngle * Math.PI) / 180;
                        const labelRadius = radius * 0.55; // Better positioning
                        const labelX = centerX + labelRadius * Math.cos(labelRadians);
                        const labelY = centerY - labelRadius * Math.sin(labelRadians);
                        
                        // Add text shadow for better readability
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                        ctx.shadowBlur = 2;
                        ctx.shadowOffsetX = 1;
                        ctx.shadowOffsetY = 1;
                        ctx.fillText(`${Math.round(currentAngle)}°`, labelX, labelY);
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                    
                    if (label) {
                            ctx.font = 'bold 14px Arial';
                            ctx.fillText(label, centerX - 10, centerY + 35);
                        }
                        
                        // Use percentage-based increment for smoother animation
                        currentAngle += angleIncrement;
                        animationId = requestAnimationFrame(animate);
                    } else {
                        // Animation complete - draw final static version
                        animationComplete = true;
                        drawFinalAngle();
                        // Resolve the promise after animation completes
                        setTimeout(() => resolve(), 200); // Reduced delay for faster completion
                    }
                };
            
            const drawFinalAngle = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw final angle with improved quality
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // First ray (horizontal)
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius, centerY);
                ctx.stroke();
                
                // Second ray (final position)
                const radians = (angle * Math.PI) / 180;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + radius * Math.cos(radians),
                    centerY - radius * Math.sin(radians)
                );
                ctx.stroke();
                
                // Draw arc with improved quality
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * 0.4, 0, -radians, true);
                ctx.stroke();
                
                // Draw vertex point
                ctx.fillStyle = '#43e97b';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw final labels with improved positioning and anti-aliasing
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const labelAngle = angle / 2;
                const labelRadians = (labelAngle * Math.PI) / 180;
                const labelRadius = radius * 0.55;
                const labelX = centerX + labelRadius * Math.cos(labelRadians);
                const labelY = centerY - labelRadius * Math.sin(labelRadians);
                
                // Add text shadow for better readability
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(`${Math.round(angle)}°`, labelX, labelY);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                
                if (label) {
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(label, centerX - 10, centerY + 35);
                }
            };
            
            animate();
                
                // Return cleanup function
                return () => {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                    }
                    // If animation is complete, redraw the final version
                    if (animationComplete) {
                        drawFinalAngle();
                    }
                };
            });
        }

        function drawComplementaryAngles(canvas) {
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;
            
            let angle1 = 0;
            let angle2 = 0;
            const targetAngle1 = 30;
            const targetAngle2 = 60;
            let animationId;
            
            const animate = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (angle1 < targetAngle1) angle1 += 1;
                if (angle1 >= targetAngle1 && angle2 < targetAngle2) angle2 += 2;
                
                // Draw first angle (30°)
                ctx.strokeStyle = '#4facfe';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                const rad1 = (angle1 * Math.PI) / 180;
                
                // First ray (horizontal)
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius, centerY);
                ctx.stroke();
                
                // Second ray (30°)
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + radius * Math.cos(rad1),
                    centerY - radius * Math.sin(rad1)
                );
                ctx.stroke();
                
                // First angle arc
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * 0.4, 0, -rad1, true);
                ctx.stroke();
                
                // Draw second angle (60°)
                if (angle2 > 0) {
                    ctx.strokeStyle = '#f093fb';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    const rad2 = ((angle1 + angle2) * Math.PI) / 180;
                    
                    // Third ray (90°)
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(
                        centerX + radius * Math.cos(rad2),
                        centerY - radius * Math.sin(rad2)
                    );
                    ctx.stroke();
                    
                    // Second angle arc
                    ctx.strokeStyle = '#fa709a';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius * 0.5, -rad1, -rad2, true);
                    ctx.stroke();
                }
                
                // Draw vertex
                ctx.fillStyle = '#43e97b';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Labels with better positioning
                ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 30° label
                const label1Angle = angle1 / 2;
                const label1Rad = (label1Angle * Math.PI) / 180;
                const label1X = centerX + (radius * 0.6) * Math.cos(label1Rad);
                const label1Y = centerY - (radius * 0.6) * Math.sin(label1Rad);
                ctx.fillText(`${Math.round(angle1)}°`, label1X, label1Y);
                
                // 60° label
                if (angle2 > 0) {
                    const label2Angle = angle1 + (angle2 / 2);
                    const label2Rad = (label2Angle * Math.PI) / 180;
                    const label2X = centerX + (radius * 0.7) * Math.cos(label2Rad);
                    const label2Y = centerY - (radius * 0.7) * Math.sin(label2Rad);
                    ctx.fillText(`${Math.round(angle2)}°`, label2X, label2Y);
                    
                    // Total label
                    ctx.font = 'bold 20px Arial';
                    ctx.fillText(`Total: ${Math.round(angle1 + angle2)}°`, centerX, centerY + 80);
                }
                
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                
                if (angle1 < targetAngle1 || angle2 < targetAngle2) {
                    animationId = requestAnimationFrame(animate);
                }
            };
            animate();
            
            return () => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            };
        }

                            ctx.lineTo(centerX + radius, centerY);
                            ctx.stroke();
                            
                            // Draw first angle (110°)
                            const rad1 = (110 * Math.PI) / 180;
                            ctx.strokeStyle = '#ec4899';
                            ctx.lineWidth = 6;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(centerX, centerY);
                            ctx.lineTo(
                                centerX - radius * Math.cos(rad1),
                                centerY - radius * Math.sin(rad1)
                            );
                            ctx.stroke();
                            
                            // Draw new 110° angle arc
                            if (progress > 0.3) {
                                // Create new 110° angle arc
                                ctx.strokeStyle = '#fbbf24';
                                ctx.lineWidth = 5;
                                ctx.lineCap = 'round';
                                ctx.beginPath();
                                
                                // Calculate arc parameters for 110° angle
                                const arcRadius = radius * 0.35;
                                const startAngle = Math.PI; // Start from left horizontal (180°)
                                // Pink line is at 180° + 110° = 290° in canvas coordinates
                                const pinkLineAngle = Math.PI + rad1; // 290°
                                
                                // Draw the arc clockwise from left horizontal to pink line (110° sweep)
                                ctx.arc(centerX, centerY, arcRadius, startAngle, pinkLineAngle, false);
                                ctx.stroke();
                            }
                            
                            // Animate second angle ray (exactly 70°)
                            const angle2 = Math.min(70, 70 * progress);
                            const rad2 = (angle2 * Math.PI) / 180;
                            
                            ctx.strokeStyle = '#f093fb';
                            ctx.lineWidth = 6;
                            ctx.lineCap = 'round';
                            ctx.beginPath();
                            ctx.moveTo(centerX, centerY);
                            ctx.lineTo(
                                centerX + radius * Math.cos(rad2),
                                centerY - radius * Math.sin(rad2)
                            );
                            ctx.stroke();
                            
                            // Draw new 110° angle arc
                            if (progress > 0.3) {
                                // Create new 110° angle arc
                                ctx.strokeStyle = '#fbbf24';
                                ctx.lineWidth = 5;
                                ctx.lineCap = 'round';
                                ctx.beginPath();
                                
                                // Calculate arc parameters for 110° angle
                                const arcRadius = radius * 0.35;
                                const startAngle = Math.PI; // Start from left horizontal (180°)
                                // Pink line is at 180° + 110° = 290° in canvas coordinates
                                const pinkLineAngle = Math.PI + rad1; // 290°
                                
                                // Draw the arc clockwise from left horizontal to pink line (110° sweep)
                                ctx.arc(centerX, centerY, arcRadius, startAngle, pinkLineAngle, false);
                                ctx.stroke();
                            }
                            
                            // Draw second angle arc (70°)
                            if (progress > 0.3) {
                                ctx.strokeStyle = '#fa709a';
                                ctx.lineWidth = 4;
                                ctx.lineCap = 'round';
                                ctx.beginPath();
                                ctx.arc(centerX, centerY, radius * 0.3, 0, -rad2, true);
                                ctx.stroke();
                                
                                // Draw angle labels
                                ctx.fillStyle = '#ffffff';
                                ctx.font = 'bold 20px Arial';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                
                                // 110° label - positioned inside the arc
                                const pinkLineAngle = Math.PI + rad1;
                                const label1Angle = Math.PI + (pinkLineAngle - Math.PI) / 2;
                                const label1Radius = radius * 0.35 - 25;
                                const label1X = centerX + label1Radius * Math.cos(label1Angle);
                                const label1Y = centerY + label1Radius * Math.sin(label1Angle);
                                ctx.fillText('110°', label1X, label1Y);
                                
                                // 70° label
                                const label2Angle = 70 / 2;
                                const label2Rad = (label2Angle * Math.PI) / 180;
                                const label2X = centerX + (radius * 0.4) * Math.cos(label2Rad);
                                const label2Y = centerY - (radius * 0.4) * Math.sin(label2Rad);
                                ctx.fillText('70°', label2X, label2Y);
                                
                                // Total label
                                if (progress > 0.7) {
                                    ctx.font = 'bold 20px Arial';
                                    ctx.fillText('Total: 180°', centerX, centerY + 80);
                                }
                            }
                            
                            progress += 0.02;
                            requestAnimationFrame(animate);
                        } else {
                            resolve();
                        }
                    };
                    animate();
                });
            };
            
            await animateSecondAngle();
            if (!shouldContinue(taskId)) return;
            
            await wait(1500);
            if (!shouldContinue(taskId)) return;
            
            await teacher.speak("When two angles form a straight line like this, they're called supplementary angles!");
            
            isPlaying = false;
        }

            if (!shouldContinue(taskId)) return;

            const slider = document.getElementById('angle-slider');
            const input = document.getElementById('angle-input');
            const typeDisplay = document.getElementById('angle-type');
            
            canvas.width = 600;
            canvas.height = 400;
            
            function getAngleType(angle) {
                if (angle === 0) return "Zero Angle";
                if (angle > 0 && angle < 90) return "Acute Angle";
                if (angle === 90) return "Right Angle";
                if (angle > 90 && angle < 180) return "Obtuse Angle";
                if (angle === 180) return "Straight Angle";
                if (angle > 180 && angle < 360) return "Reflex Angle";
                if (angle === 360) return "Complete Angle";
                return "Angle";
            }
            
            function updateAngle(value) {
                const angle = parseInt(value);
                slider.value = angle;
                input.value = angle;
                typeDisplay.value = getAngleType(angle);
                
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 120;
                
                // Draw rays
                ctx.strokeStyle = '#4facfe';
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius, centerY);
                ctx.stroke();
                
                const radians = (angle * Math.PI) / 180;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + radius * Math.cos(radians),
                    centerY - radius * Math.sin(radians)
                );
                ctx.stroke();
                
                // Draw arc
                if (angle > 0) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius * 0.4, 0, -radians, true);
                    ctx.stroke();
                }
                
                // Draw vertex
                ctx.fillStyle = '#43e97b';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw labels for the rays
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('A', centerX + radius + 20, centerY + 5);
                ctx.fillText('B', centerX + radius * Math.cos(radians) + 20, centerY - radius * Math.sin(radians) + 5);
                ctx.textAlign = 'left'; // Reset alignment
                
                // Angle measurement
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`${angle}°`, centerX + 10, centerY - radius * 0.45);
            }
            
            slider.addEventListener('input', (e) => updateAngle(e.target.value));
            input.addEventListener('input', (e) => updateAngle(e.target.value));
            
            updateAngle(45);
            
            isPlaying = false;
        }

        function resetApplication() {
            stopCurrentDemo();
            
            const content = createStageContent();
            content.innerHTML = `
                <h2 class="chart-title">Welcome to Geometry Fundamentals!</h2>
                <div class="value-display">Let's Begin!</div>
                <p style="text-align: center; max-width: 600px; margin-top: 20px;">
                    Lines and angles are the foundation of geometry. Choose a lesson below to start your journey!
                </p>
            `;
            
            document.querySelectorAll('.demo-btn').forEach(btn => btn.classList.remove('active'));
            currentDemo = null;
            
            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome back! Choose any lesson to continue your journey into geometry!");
            }, 500);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize teacher
                const teacher = createNewTeacher();
                setTimeout(() => {
                    teacher.speak("Welcome to Lines and Angles Mastery! Choose any lesson to begin your geometry journey!");
                }, 500);
            
            // Button handlers
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;
                    
                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'definitions':
                            showDefinitions();
                            break;
                        case 'angles':
                            showAngles();
                            break;
                        case 'types':
                            showTypes();
                            break;
                        case 'pairs':
                            showPairs();
                            break;
                        case 'realworld':
                            showRealWorld();
                            break;
                        case 'quiz':
                            showQuiz();
                            break;
                        case 'builder':
                            showBuilder();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });
            
            // Audio control
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);
                
                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }
                
                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });
        });
    </script>
