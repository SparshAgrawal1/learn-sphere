<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume of Spheres - Master 3D Geometry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(251, 191, 36, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(67, 233, 123, 0.05) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes backgroundShift {
            0%, 100% { 
                transform: translateX(0) translateY(0) scale(1);
                opacity: 0.3;
            }
            25% { 
                transform: translateX(-20px) translateY(-10px) scale(1.1);
                opacity: 0.5;
            }
            50% { 
                transform: translateX(10px) translateY(-20px) scale(0.9);
                opacity: 0.4;
            }
            75% { 
                transform: translateX(-10px) translateY(10px) scale(1.05);
                opacity: 0.6;
            }
        }

        /* Header - Compact with Animations */
        .header {
            text-align: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .header h1 {
            font-size: 2rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            animation: titlePulse 2s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Layout */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Demo Stage - Takes most space */
        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            animation: stageGlow 4s ease-in-out infinite;
        }

        .demo-stage::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                rgba(79, 172, 254, 0.1) 0%, 
                transparent 25%, 
                transparent 75%, 
                rgba(251, 191, 36, 0.1) 100%);
            animation: stageShimmer 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes stageGlow {
            0%, 100% { 
                box-shadow: var(--shadow-primary);
                border-color: var(--glass-border);
            }
            50% { 
                box-shadow: 0 15px 40px rgba(79, 172, 254, 0.3);
                border-color: rgba(79, 172, 254, 0.5);
            }
        }

        @keyframes stageShimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        /* Stage Content */
        .stage-content {
            width: 100%;
            height: 100%;
            display: none;
            animation: slideInFromBottom 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stage-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes slideInFromBottom {
            from { 
                opacity: 0; 
                transform: translateY(50px) scale(0.9); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @keyframes slideInFromLeft {
            from { 
                opacity: 0; 
                transform: translateX(-50px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes slideInFromRight {
            from { 
                opacity: 0; 
                transform: translateX(50px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes zoomIn {
            from { 
                opacity: 0; 
                transform: scale(0.5); 
            }
            to { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        @keyframes bounceIn {
            0% { 
                opacity: 0; 
                transform: scale(0.3); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1.05); 
            }
            70% { 
                transform: scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        /* Controls - Below Demo */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            animation: buttonFloat 3s ease-in-out infinite;
        }

        .demo-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .demo-btn:hover::before {
            left: 100%;
        }

        @keyframes buttonFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        .demo-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.6);
            border-color: var(--text-accent);
        }

        .demo-btn:active {
            transform: translateY(-2px) scale(0.98);
            transition: all 0.1s;
        }

        .demo-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            animation: activePulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
        }

        @keyframes activePulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(79, 172, 254, 1);
                transform: scale(1.02);
            }
        }

        /* Audio Control */
        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        /* 3D Visualization */
        .sphere-3d-container {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        /* Formula Display */
        .formula-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            font-size: 1.2rem;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: slideInFromLeft 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .formula-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(79, 172, 254, 0.1), transparent);
            animation: formulaShimmer 2s ease-in-out infinite;
        }

        @keyframes formulaShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .formula {
            font-size: 1.4rem;
            color: var(--text-accent);
            margin: 10px 0;
            font-weight: 600;
            animation: formulaGlow 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }

        @keyframes formulaGlow {
            0% { 
                text-shadow: 0 0 5px rgba(251, 191, 36, 0.5);
                transform: scale(1);
            }
            100% { 
                text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
                transform: scale(1.02);
            }
        }

        /* Value Display */
        .value-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-accent);
            margin: 20px 0;
            animation: valueBounce 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
        }

        @keyframes valueBounce {
            0%, 100% { 
                transform: translateY(0px) scale(1);
                text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
            }
            50% { 
                transform: translateY(-5px) scale(1.05);
                text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            }
        }


        /* Example Content */
        .example-title {
            font-size: 1.5rem;
            color: var(--text-accent);
            margin-bottom: 20px;
            text-align: center;
            animation: titleSlideIn 0.8s ease-out;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        @keyframes titleSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .example-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            animation: contentFadeIn 1s ease-out 0.3s both;
        }

        @keyframes contentFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .example-step {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid var(--text-accent);
            animation: stepSlideIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .example-step::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.1), transparent);
            animation: stepReveal 1s ease-out 0.5s forwards;
        }

        @keyframes stepSlideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes stepReveal {
            from { width: 0; }
            to { width: 100%; }
        }

        .step-title {
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 8px;
        }

        .step-formula {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
            color: var(--text-primary);
        }

        /* Chart Container */
        .chart-container {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        /* Quiz Styles */
        .quiz-question {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
            animation: quizSlideIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .quiz-question::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(79, 172, 254, 0.1), transparent);
            animation: quizShimmer 3s ease-in-out infinite;
        }

        @keyframes quizSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes quizShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            animation: optionFloat 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .quiz-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        @keyframes optionFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text-accent);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .quiz-option:hover::before {
            left: 100%;
        }

        .quiz-option.correct {
            background: var(--success-gradient);
            border-color: transparent;
            animation: correctBounce 0.6s ease-out;
            box-shadow: 0 0 20px rgba(67, 233, 123, 0.6);
        }

        .quiz-option.incorrect {
            background: var(--warning-gradient);
            border-color: transparent;
            animation: incorrectShake 0.6s ease-out;
            box-shadow: 0 0 20px rgba(250, 112, 154, 0.6);
        }

        @keyframes correctBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .quiz-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .quiz-result.correct {
            background: var(--success-gradient);
        }

        .quiz-result.incorrect {
            background: var(--warning-gradient);
        }


        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .demo-btn {
                font-size: 0.85rem;
                padding: 10px 18px;
            }
            
            .sphere-3d-container {
                height: 300px;
            }
            
            .value-display {
                font-size: 1.4rem;
            }
            
            .example-content {
                padding: 0 10px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                gap: 8px;
            }
            
            .demo-btn {
                font-size: 0.8rem;
                padding: 8px 15px;
            }
            
            .main-container {
                padding: 15px;
                gap: 15px;
            }
        }

        /* Additional animations */
        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .rotate-animation {
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Volume visualization */
        .volume-cube-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            max-width: 200px;
            margin: 20px auto;
            animation: gridSlideIn 1s ease-out;
        }

        @keyframes gridSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .volume-cube {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 5px;
            animation: fillCube 0.5s ease-out forwards, cubeFloat 2s ease-in-out infinite;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .volume-cube::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: cubeShimmer 2s ease-in-out infinite;
        }

        @keyframes fillCube {
            to { opacity: 1; }
        }

        @keyframes cubeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes cubeShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Hemisphere visualization */
        .hemisphere-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px 0;
            animation: containerSlideIn 1s ease-out;
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .full-sphere {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, var(--text-accent), #f59e0b);
            border-radius: 50%;
            animation: sphereRotate 4s linear infinite, sphereFloat 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .full-sphere::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            animation: sphereShine 2s ease-in-out infinite;
        }

        @keyframes sphereRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes sphereFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        @keyframes sphereShine {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .hemisphere {
            width: 100px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, var(--text-accent), #f59e0b);
            border-radius: 100px 100px 0 0;
            animation: hemisphereFloat 3s ease-in-out infinite, hemisphereGlow 2s ease-in-out infinite alternate;
            position: relative;
            overflow: hidden;
        }

        .hemisphere::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 100px 100px 0 0;
            animation: hemisphereShine 2s ease-in-out infinite;
        }

        @keyframes hemisphereFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes hemisphereGlow {
            0% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); }
        }

        @keyframes hemisphereShine {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .equals-sign {
            font-size: 2rem;
            color: var(--text-accent);
            font-weight: bold;
            animation: signPulse 2s ease-in-out infinite;

            constructor() {
                this.synth = window.speechSynthesis;
                this.voice = null;
                this.rate = 0.8;
                this.pitch = 1.0;
                this.volume = 0.9;
                this.isEnabled = globalAudioEnabled;
                this.currentUtterance = null;
                this.isDestroyed = false;
                this.setupVoice();
            }

            setupVoice() {
                const loadVoices = () => {
                    const voices = this.synth.getVoices();
                        // Prefer female voices for educational content
                        this.voice = voices.find(voice => 
                            voice.name.includes('Female') || 
                            voice.name.includes('Samantha') ||
                            voice.name.includes('Karen') ||
                        voice.name.includes('Google UK English Female') ||
                        voice.name.includes('Microsoft Zira Desktop')
                    ) || voices.find(v => v.lang.includes('en')) || voices[0];
                };
                loadVoices();
                this.synth.onvoiceschanged = loadVoices;
            }

            async speak(text, delay = 0) {
                if (!this.isEnabled || !globalAudioEnabled || !text || this.isDestroyed) return;

                return new Promise((resolve) => {
                    setTimeout(() => {
                        if (this.isDestroyed) {
                            resolve();
                            return;
                        }
                        this.stop();
                        const utterance = new SpeechSynthesisUtterance(text);
                            utterance.voice = this.voice;
                        utterance.rate = this.rate;
                        utterance.pitch = this.pitch;
                        utterance.volume = this.volume;
                        
                        utterance.onend = resolve;
                        utterance.onerror = resolve;
                        
                        this.currentUtterance = utterance;
                        this.synth.speak(utterance);
                    }, delay);
                });
            }

            stop() {
                this.synth.cancel();
                    this.currentUtterance = null;
            }

            destroy() {
                this.isDestroyed = true;
                this.stop();
                this.currentUtterance = null;
            }

        // 3D Sphere Creation
        function create3DSphere(container, radius = 2, segments = 32) {
            // Clean up existing renderer
            if (sphere3DRenderer) {
                sphere3DRenderer.setAnimationLoop(null);
                container.innerHTML = '';
            }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // Create sphere geometry
            const geometry = new THREE.SphereGeometry(radius, segments, segments);
            const material = new THREE.MeshPhongMaterial({
                color: 0x4facfe,
                transparent: true,
                opacity: 0.8,
                shininess: 100
            });

            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Add wireframe overlay
            const wireframe = new THREE.WireframeGeometry(geometry);
            const line = new THREE.LineSegments(wireframe, new THREE.LineBasicMaterial({ color: 0xfbbf24, opacity: 0.3, transparent: true }));
            scene.add(line);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            camera.position.z = 8;

            // Store references
            sphere3DRenderer = renderer;
            sphere3DScene = scene;
            sphere3DCamera = camera;
            sphere3DMesh = sphere;

            return { renderer, scene, camera, sphere };
        }

        function animate3DSphere() {
            if (!sphere3DRenderer || !sphere3DScene || !sphere3DCamera) return;

            let time = 0;
            sphere3DRenderer.setAnimationLoop(() => {
                time += 0.01;
                if (sphere3DMesh) {
                    // Enhanced rotation with multiple axes
                    sphere3DMesh.rotation.y += 0.01;
                    sphere3DMesh.rotation.x += 0.005;
                    sphere3DMesh.rotation.z += 0.002;
                    
                    // Add floating animation
                    sphere3DMesh.position.y = Math.sin(time) * 0.2;
                    
                    // Add pulsing scale effect
                    const scale = 1 + Math.sin(time * 2) * 0.1;
                    sphere3DMesh.scale.set(scale, scale, scale);
                    
                    // Add color animation
                    const hue = (time * 10) % 360;
                    sphere3DMesh.material.color.setHSL(hue / 360, 0.7, 0.6);
                }
                sphere3DRenderer.render(sphere3DScene, sphere3DCamera);
            });
        }

                            option.style.border = '2px solid transparent';
                            option.style.transform = 'translateY(0)';
                        }
                    });
                });
            }

            async function selectAnswer(selectedIndex) {
                const q = questions[currentQuestion];
                const options = document.querySelectorAll('.quiz-option');
                const resultDiv = document.getElementById('quiz-result');

                // Disable all options
                options.forEach(opt => opt.style.pointerEvents = 'none');

                // Show correct/incorrect
                if (selectedIndex === q.correct) {
                    options[selectedIndex].style.background = 'rgba(67, 233, 123, 0.3)';
                    options[selectedIndex].style.border = '2px solid var(--success-gradient)';
                    options[selectedIndex].style.color = 'var(--text-accent)';
                    resultDiv.style.background = 'rgba(67, 233, 123, 0.2)';
                    resultDiv.style.border = '2px solid var(--success-gradient)';
                    resultDiv.style.color = 'var(--text-accent)';
                    resultDiv.textContent = '✓ Correct! ' + q.explanation;
                    score++;
                    await teacher.speak("Correct! " + q.explanation);
                } else {
                    options[selectedIndex].style.background = 'rgba(250, 112, 154, 0.3)';
                    options[selectedIndex].style.border = '2px solid var(--warning-gradient)';
                    options[selectedIndex].style.color = 'var(--text-accent)';
                    options[q.correct].style.background = 'rgba(67, 233, 123, 0.3)';
                    options[q.correct].style.border = '2px solid var(--success-gradient)';
                    options[q.correct].style.color = 'var(--text-accent)';
                    resultDiv.style.background = 'rgba(250, 112, 154, 0.2)';
                    resultDiv.style.border = '2px solid var(--warning-gradient)';
                    resultDiv.style.color = 'var(--text-accent)';
                    resultDiv.textContent = '✗ Incorrect. ' + q.explanation;
                    await teacher.speak("Not quite right. " + q.explanation);
                }

                resultDiv.style.display = 'block';

                // Move to next question
                await wait(3000);
                if (!shouldContinue(taskId)) return;

                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    showFinalScore();
                }
            }

            function showFinalScore() {
                content.innerHTML = `
                    <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
                        <h2 class="example-title" style="text-align: center; margin-bottom: 30px; font-size: 2rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Quiz Complete!</h2>
                        <div class="value-display" style="text-align: center; font-size: 2rem; margin-bottom: 30px; color: var(--text-accent);">Final Score: ${score}/2</div>
                        <div class="quiz-question" style="background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); text-align: center;">
                            <h3 style="font-size: 1.8rem; margin-bottom: 20px; color: var(--text-accent);">${score === 2 ? '🎉 Perfect Score!' : score >= 1 ? '👍 Great Job!' : '📚 Keep Studying!'}</h3>
                            <p style="margin: 20px 0; font-size: 1.1rem; color: var(--text-primary);">
                                ${score === 2 ? 'You have mastered sphere volume calculations!' :
                                  score >= 1 ? 'You understand most concepts well!' :
                                  'Review the lessons and try again!'}
                            </p>
                            <div class="formula-box" style="background: rgba(79, 172, 254, 0.1); padding: 20px; border-radius: 15px; margin-top: 25px;">
                                <div class="formula" style="font-size: 1.5rem; margin-bottom: 10px; color: var(--text-accent);">Remember: V = (4/3)πr³</div>
                                <p style="color: var(--text-secondary);">Keep practicing with the examples!</p>
                            </div>
                        </div>
                    </div>
                `;

                teacher.speak(`Quiz complete! You scored ${score} out of 2. ${score === 2 ? 'Excellent work!' : 'Keep practicing!'}`);
            }

            await teacher.speak("Time to test your knowledge! Answer these questions about sphere volume.");
            await wait(1000);
            if (!shouldContinue(taskId)) return;

            showQuestion();
        }


        async function showCompleteLesson() {
            const taskId = 'complete';
            stopCurrentDemo();
            isPlaying = true;
            
            const teacher = createNewTeacher(taskId);
            
            // Welcome message
            const welcomeContent = createStageContent();
            welcomeContent.innerHTML = `
                <h2 class="example-title">Complete Volume Lesson</h2>
                <div class="value-display">Let's Learn Everything!</div>
                <p style="text-align: center; max-width: 600px; margin-top: 20px;">
                    We'll explore sphere volume step by step, from mathematical formulas to real applications.
                </p>
            `;
            
            await teacher.speak("Welcome to the complete lesson on sphere volume! Let's journey through the fascinating world of three-dimensional space measurement.");
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Introduction
            await showIntroductionContent(taskId);
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Formula
            await teacher.speak("Let's explore the mathematical formula in detail.");
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            await showFormulaContent(taskId);
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Examples
            await teacher.speak("Time to practice with real examples!");
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            await showExamplesContent(taskId);
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Hemisphere
            await teacher.speak("Next, let's understand hemispheres and how their volume relates to a full sphere.");
            if (!shouldContinue(taskId)) return;
            
            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            await showHemisphereContent(taskId);
            if (!shouldContinue(taskId)) return;
            
            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Real World
            await teacher.speak("Let's see how volume calculations are used in the real world!");
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            await showRealWorldContent(taskId);
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Chart Analysis
            await teacher.speak("Finally, let's analyze the mathematical relationships through charts!");
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            await showChartContent(taskId);
            if (!shouldContinue(taskId)) return;

            await wait(1000);
            if (!shouldContinue(taskId)) return;
            
            // Final message
            const finalContent = createStageContent();
            finalContent.innerHTML = `
                <h2 class="example-title">Congratulations!</h2>
                <div class="value-display">🎉 Volume Mastery Complete! 🎉</div>
                <p style="text-align: center; max-width: 600px; margin-top: 20px;">
                    You've mastered sphere volume! You understand the water displacement method,
                    can use the formula confidently, and know how volume applies in real life. Excellent work!
                </p>
            `;
            
            await teacher.speak("Congratulations! You've completed the full lesson on sphere volume. You now understand how to measure the space inside spheres and hemispheres, and you know where this knowledge is useful. Outstanding achievement!");
            
            isPlaying = false;
        }

        function resetApplication() {
            // Force stop any running demo
            currentDemoAborted = true;
            currentRunId++;
            currentTaskId = null;
            isPlaying = false;
            
            // Stop and destroy current teacher
            if (currentTeacher) {
                currentTeacher.destroy();
                currentTeacher = null;
            }
            
            // Clear all timeouts
            animationTimeouts.forEach(timeout => clearTimeout(timeout));
            animationTimeouts = [];
            
            // Stop 3D renderer
            if (sphere3DRenderer) {
                sphere3DRenderer.setAnimationLoop(null);
            }
            
            // Clear stage and show welcome
            const content = createStageContent();
            content.innerHTML = `
                <h2 style="font-size: 2rem; margin-bottom: 20px;">Welcome to Sphere Volume!</h2>
                <div class="value-display">Let's Measure 3D Space!</div>
                <p style="text-align: center; max-width: 600px; margin-top: 20px;">
                    Volume tells us how much space is inside a sphere. From mathematical formulas to real applications,
                    choose a lesson below to start your mathematical journey!
                </p>
            `;
            
            // Clear active button states
            document.querySelectorAll('.demo-btn').forEach(btn => btn.classList.remove('active'));
            
            // Reset current demo
            currentDemo = null;
            
            // Create new teacher and welcome message
            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome back! Choose any lesson to continue exploring the amazing world of sphere volume!");
            }, 500);
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Create floating particles
            createParticles();
            
            // Initialize teacher
            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome to the volume of spheres! Choose any lesson to begin exploring how we measure space inside three-dimensional objects!");
            }, 500);
            
            // Button handlers
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Clear active states
                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;
                    
                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'introduction':
                            showIntroduction();
                            break;
                        case 'formula':
                            showFormula();
                            break;
                        case 'examples':
                            showExamples();
                            break;
                        case 'hemisphere':
                            showHemisphere();
                            break;
                        case 'realworld':
                            showRealWorld();
                            break;
                        case 'chart':
                            showChart();
                            break;
                        case 'quiz':
                            showQuiz();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });
            
            // Audio control
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);
                
                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }
                
                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });
        });
    </script>
</body>
</html>
