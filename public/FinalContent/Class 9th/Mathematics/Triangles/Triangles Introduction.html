<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Triangles & Congruence - Interactive Learning</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --triangle-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --congruence-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            background: var(--triangle-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            max-height: 600px;
        }

        .stage-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            padding: 5px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .demo-btn.active {
            background: var(--triangle-gradient);
            color: white;
            border-color: transparent;
        }

        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--triangle-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        .math-title {
            font-size: 1.3rem;
            margin-top: 0px;
            margin-bottom: 10px;
            color: var(--text-accent);
            text-align: center;
            font-weight: 600;
        }

        .math-description {
            font-size: 1rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 900px;
            margin: 0 auto 10px auto;
            line-height: 1.6;
            padding: 8px;
        }

        .content-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            margin: 6px 0;
            backdrop-filter: blur(10px);
        }

        .formula-box {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            margin: 8px 0;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .formula {
            font-size: 1.1rem;
            color: var(--text-accent);
            font-weight: 600;
        }

        .value-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-accent);
            text-align: center;
            margin: 15px 0;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin: 10px 0;
        }

        .grid-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin: 15px 0;
        }

        .info-box {
            background: var(--glass-bg);
            border-left: 4px solid var(--text-accent);
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
        }

        .highlight {
            color: var(--text-accent);
            font-weight: 600;
        }

        .triangle-svg {
            max-width: 100%;
            height: auto;
        }

        .congruence-symbol {
            font-size: 1.5rem;
            color: var(--text-accent);
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 6px 0;
            color: var(--text-secondary);
            position: relative;
            padding-left: 20px;
        }

        li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--text-accent);
            font-weight: bold;
        }

        .example-box {
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.1) 0%, rgba(56, 249, 215, 0.1) 100%);
            border: 2px solid rgba(67, 233, 123, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        .note-box {
            background: linear-gradient(135deg, rgba(250, 112, 154, 0.1) 0%, rgba(254, 225, 64, 0.1) 100%);
            border: 2px solid rgba(250, 112, 154, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .grid-2col, .grid-3col {
                grid-template-columns: 1fr;
            }
            
            .math-title {
                font-size: 1.3rem;
            }
            
            .value-display {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Introduction to Triangles & Congruence</h1>
        <p>Chapter 7 - Class 9 Mathematics | Interactive Smart Learning</p>
    </div>

    <div id="audio-control">
        <button id="mute-btn" class="control-btn">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="main-container">
        <div class="demo-stage">
            <div class="stage-content" id="content"></div>
        </div>

        <div class="controls">
            <button class="demo-btn" data-demo="complete">📚 Complete Lesson</button>
            <button class="demo-btn" data-demo="what-is-triangle">📐 What is a Triangle?</button>
            <button class="demo-btn" data-demo="understanding-congruence">🔄 Understanding Congruence</button>
            <button class="demo-btn" data-demo="congruent-triangles">△ Congruent Triangles</button>
            <button class="demo-btn" data-demo="correspondence">↔️ Correspondence</button>
            <button class="demo-btn" data-demo="cpct">✓ CPCT</button>
            <button class="demo-btn" data-demo="applications">🏭 Real-Life Applications</button>
            <button class="demo-btn" data-demo="reset">🔄 Reset</button>
        </div>
    </div>

    <script>
        // Global variables
        let currentDemo = null;
        let globalAudioEnabled = true;
        let currentTeacher = null;

        // Text-to-Speech Teacher
        function createNewTeacher() {
            if (currentTeacher) {
                currentTeacher.stop();
            }

            const teacher = {
                isEnabled: globalAudioEnabled,
                currentUtterance: null,
                
                speak(text, onComplete) {
                    if (!this.isEnabled || !window.speechSynthesis) {
                        // If audio is disabled, still call onComplete after a short delay
                        if (onComplete) setTimeout(onComplete, 500);
                        return;
                    }
                    
                    this.stop();
                    
                    this.currentUtterance = new SpeechSynthesisUtterance(text);
                    this.currentUtterance.rate = 0.9;
                    this.currentUtterance.pitch = 1;
                    this.currentUtterance.volume = 1;
                    
                    // Call onComplete when speech ends
                    if (onComplete) {
                        this.currentUtterance.onend = () => {
                            // Add a small delay before moving to next step
                            setTimeout(onComplete, 1000);
                        };
                    }
                    
                    window.speechSynthesis.speak(this.currentUtterance);
                },
                
                stop() {
                    if (window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                    }
                }
            };
            
            currentTeacher = teacher;
            return teacher;
        }

        // Content transition
        function transitionToNextStep(content) {
            const contentDiv = document.getElementById('content');
            contentDiv.style.animation = 'fadeIn 0.5s ease-out forwards';
            contentDiv.innerHTML = content;
        }

        // SVG Triangle Generator with Perfect Angle Arcs
        function createTriangle(vertices, labels, showAngles = true, sides = [], color = '#4facfe') {
            const [A, B, C] = vertices;
            const points = `${A[0]},${A[1]} ${B[0]},${B[1]} ${C[0]},${C[1]}`;
            
            let svg = `
                <svg width="350" height="280" viewBox="0 0 350 280" class="triangle-svg">
                    <!-- Triangle -->
                    <polygon points="${points}" 
                             fill="none" 
                             stroke="${color}" 
                             stroke-width="3"
                             opacity="0">
                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
                    </polygon>
            `;

            // Draw perfect angle arcs automatically
            if (showAngles) {
                // Calculate angles using vectors
                const arcRadius = 25;
                
                // Angle at A
                const BA = [B[0] - A[0], B[1] - A[1]];
                const CA = [C[0] - A[0], C[1] - A[1]];
                const angleBA = Math.atan2(BA[1], BA[0]);
                const angleCA = Math.atan2(CA[1], CA[0]);
                
                svg += createAngleArc(A[0], A[1], arcRadius, angleCA, angleBA, '∠A');
                
                // Angle at B
                const AB = [A[0] - B[0], A[1] - B[1]];
                const CB = [C[0] - B[0], C[1] - B[1]];
                const angleAB = Math.atan2(AB[1], AB[0]);
                const angleCB = Math.atan2(CB[1], CB[0]);
                
                svg += createAngleArc(B[0], B[1], arcRadius, angleAB, angleCB, '∠B');
                
                // Angle at C
                const AC = [A[0] - C[0], A[1] - C[1]];
                const BC = [B[0] - C[0], B[1] - C[1]];
                const angleAC = Math.atan2(AC[1], AC[0]);
                const angleBC = Math.atan2(BC[1], BC[0]);
                
                svg += createAngleArc(C[0], C[1], arcRadius, angleBC, angleAC, '∠C');
            }
            
            // Helper function to create perfect angle arc
            function createAngleArc(cx, cy, radius, startAngle, endAngle, label, labelOffset = 35) {
                // Normalize angles
                while (endAngle < startAngle) endAngle += 2 * Math.PI;
                
                const startX = cx + radius * Math.cos(startAngle);
                const startY = cy + radius * Math.sin(startAngle);
                const endX = cx + radius * Math.cos(endAngle);
                const endY = cy + radius * Math.sin(endAngle);
                
                const angleDiff = endAngle - startAngle;
                const largeArc = angleDiff > Math.PI ? 1 : 0;
                
                // Label position at middle of arc
                const midAngle = (startAngle + endAngle) / 2;
                const labelX = cx + labelOffset * Math.cos(midAngle);
                const labelY = cy + labelOffset * Math.sin(midAngle);
                
                return `
                    <path d="M ${startX} ${startY} A ${radius} ${radius} 0 ${largeArc} 1 ${endX} ${endY}"
                          fill="none"
                          stroke="#fbbf24"
                          stroke-width="2.5"
                          stroke-linecap="round"
                          opacity="0">
                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
                    </path>
                    <text x="${labelX}" y="${labelY + 5}" 
                          fill="#fbbf24" 
                          font-size="15" 
                          font-weight="bold"
                          text-anchor="middle"
                          dominant-baseline="middle"
                          opacity="0">
                        ${label}
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
                    </text>
                `;
            }

            // Vertex labels with better positioning
            const labelOffsets = {
                A: [0, -18],
                B: [-18, 18],
                C: [18, 18],
                P: [0, -18],
                Q: [-18, 18],
                R: [18, 18]
            };

            labels.forEach((label, idx) => {
                const [x, y] = vertices[idx];
                const [dx, dy] = labelOffsets[label] || [0, -18];
                
                svg += `
                    <circle cx="${x}" cy="${y}" r="4" fill="${color}" opacity="0">
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
                    </circle>
                    <text x="${x + dx}" y="${y + dy}" 
                          fill="#ffffff" 
                          font-size="22" 
                          font-weight="bold"
                          text-anchor="middle"
                          dominant-baseline="middle"
                          opacity="0">
                        ${label}
                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
                    </text>
                `;
            });

            // Side labels with better positioning to avoid overlap
            if (sides.length > 0) {
                sides.forEach((side, idx) => {
                    const [label, position] = side;
                    svg += `
                        <text x="${position[0]}" y="${position[1]}" 
                              fill="#43e97b" 
                              font-size="15" 
                              font-weight="700"
                              text-anchor="middle"
                              dominant-baseline="middle"
                              opacity="0">
                            ${label}
                            <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
                        </text>
                    `;
                });
            }

            svg += `</svg>`;
            return svg;
        }

        // Complete Lesson
        function showCompleteLesson() {
            let step = 0;
            const teacher = createNewTeacher();
            
            const steps = [
                {
                    content: `
                        <h2 class="math-title">Introduction to Triangles & Congruence Basics</h2>
                        <div class="value-display">📐 Complete Lesson</div>
                        <div class="math-description">
                            Let's explore triangles, their components, and the fascinating concept of congruence!
                        </div>
                        <div class="formula-box">
                            <p class="formula">△ABC: The World of Three Sides</p>
                        </div>
                    `,
                    narration: "Welcome to Introduction to Triangles and Congruence Basics! In this lesson, we'll explore what triangles are, their components, and understand the concept of congruence."
                },
                {
                    content: `
                        <h2 class="math-title">1.1 What is a Triangle? 📐</h2>
                        <div class="grid-2col" style="max-width: 1000px;">
                            <div>
                                ${createTriangle(
                                    [[175, 50], [100, 220], [250, 220]],
                                    ['A', 'B', 'C'],
                                    true,
                                    [
                                        ['AB', [120, 130]],
                                        ['BC', [175, 245]],
                                        ['CA', [230, 130]]
                                    ]
                                )}
                            </div>
                            <div class="content-card">
                                <h3 class="highlight" style="margin-bottom: 15px;">Definition</h3>
                                <p style="color: #e2e8f0; margin-bottom: 15px;">
                                    A <span class="highlight">triangle</span> is a closed figure formed by three intersecting lines.
                                </p>
                                <p style="color: #fbbf24; margin-bottom: 10px;">"Tri" means "Three"</p>
                                <div class="info-box">
                                    <p style="font-weight: 600; margin-bottom: 10px;">Components:</p>
                                    <ul>
                                        <li><span class="highlight">3 Sides:</span> AB, BC, CA</li>
                                        <li><span class="highlight">3 Angles:</span> ∠A, ∠B, ∠C</li>
                                        <li><span class="highlight">3 Vertices:</span> A, B, C</li>
                                    </ul>
                                </div>
                                <div class="formula-box" style="margin-top: 15px;">
                                    <p class="formula">△ABC</p>
                                    <p style="color: #e2e8f0; margin-top: 8px; font-size: 0.9rem;">Notation for Triangle ABC</p>
                                </div>
                            </div>
                        </div>
                    `,
                    narration: "A triangle is a closed figure formed by three intersecting lines. The word 'tri' means 'three'. Every triangle has three sides, three angles, and three vertices. We denote triangle ABC as triangle A B C."
                },
                {
                    content: `
                        <h2 class="math-title">1.2 Understanding Congruence 🔄</h2>
                        <div class="math-description">
                            Two figures are <span class="highlight">congruent</span> if they have the <span class="highlight">same shape</span> and <span class="highlight">same size</span>
                        </div>
                        <div class="grid-2col" style="max-width: 1000px;">
                            <div class="content-card">
                                <h3 class="highlight" style="margin-bottom: 15px;">Real-Life Examples</h3>
                                <ul>
                                    <li>Two photographs of the same size 📷</li>
                                    <li>Two bangles of the same size 💍</li>
                                    <li>Two ATM cards from the same bank 💳</li>
                                    <li>Two one-rupee coins (same year) 🪙</li>
                                </ul>
                                <div class="example-box" style="margin-top: 20px;">
                                    <p style="font-weight: 600; color: #43e97b; margin-bottom: 10px;">Activity:</p>
                                    <p style="color: #e2e8f0;">
                                        Draw two circles of the same radius and place one on the other. 
                                        They cover each other completely!
                                    </p>
                                    <p style="color: #fbbf24; margin-top: 10px; font-weight: 600;">
                                        → They are congruent circles ✓
                                    </p>
                                </div>
                            </div>
                            <div>
                                <svg width="350" height="280" viewBox="0 0 350 280">
                                    <!-- First Circle -->
                                    <circle cx="120" cy="140" r="60" 
                                            fill="none" 
                                            stroke="#4facfe" 
                                            stroke-width="3"
                                            opacity="0">
                                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
                                    </circle>
                                    <text x="120" y="220" fill="#4facfe" font-size="16" font-weight="bold" text-anchor="middle">
                                        Circle 1
                                    </text>
                                    
                                    <!-- Second Circle (overlapping) -->
                                    <circle cx="230" cy="140" r="60" 
                                            fill="none" 
                                            stroke="#43e97b" 
                                            stroke-width="3"
                                            stroke-dasharray="5,5"
                                            opacity="0">
                                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
                                        <animate attributeName="cx" from="230" to="120" dur="1.5s" begin="1s" fill="freeze"/>
                                    </circle>
                                    <text x="230" y="220" fill="#43e97b" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">
                                        Circle 2
                                        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
                                        <animate attributeName="x" from="230" to="120" dur="1.5s" begin="1s" fill="freeze"/>
                                    </text>
                                    
                                    <!-- Congruence Symbol -->
                                    <text x="175" y="100" fill="#fbbf24" font-size="32" font-weight="bold" text-anchor="middle" opacity="0">
                                        ≅
                                        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
                                    </text>
                                </svg>
                            </div>
                        </div>
                    `,
                    narration: "Two figures are congruent if they have the same shape and same size. When placed on each other, they cover each other completely. Examples include two photographs of the same size, two bangles of the same size, or two coins minted in the same year."
                },
                {
                    content: `
                        
                        <div class="grid-2col" style="max-width: 1100px;">
                            <div>
                                <h3 class="highlight" style="margin-bottom: 15px; text-align: center;">Triangle ABC</h3>
                                ${createTriangle(
                                    [[175, 50], [100, 220], [250, 220]],
                                    ['A', 'B', 'C'],
                                    true,
                                    [
                                        ['AB = 4 cm', [120, 130]],
                                        ['BC = 5 cm', [175, 245]],
                                        ['CA = 4 cm', [230, 130]]
                                    ],
                                    '#4facfe'
                                )}
                            </div>
                            <div>
                                <h3 class="highlight" style="margin-bottom: 15px; text-align: center;">Triangle PQR</h3>
                                ${createTriangle(
                                    [[175, 50], [100, 220], [250, 220]],
                                    ['P', 'Q', 'R'],
                                    true,
                                    [
                                        ['PQ = 4 cm', [120, 130]],
                                        ['QR = 5 cm', [175, 245]],
                                        ['RP = 4 cm', [230, 130]]
                                    ],
                                    '#43e97b'
                                )}
                            </div>
                        </div>
                        <div class="formula-box" style="max-width: 900px; margin: 20px auto;">
                            <p class="formula" style="font-size: 1.8rem; margin-bottom: 15px;">△ABC ≅ △PQR</p>
                            <div class="info-box" style="text-align: left;">
                                <p style="font-weight: 600; margin-bottom: 10px; color: #fbbf24;">
                                    Two triangles are congruent if:
                                </p>
                                <ul>

                </div>
