<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorization of Polynomials - Interactive Learning</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --equation-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --solution-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 10px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 1.8rem;
            background: var(--equation-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 550px;
            transition: all 0.3s ease;
        }

        .stage-content {
            width: 100%;
            max-width: 900px;
            display: none;
            animation: fadeIn 0.5s ease-out;
            overflow: hidden;
        }

        .stage-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .demo-btn.active {
            background: var(--equation-gradient);
            color: white;
            border-color: transparent;
        }

        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--equation-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        .math-title {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-accent);
            text-align: center;
            font-weight: 600;
        }

        .math-description {

            color: var(--text-secondary);
            text-align: center;

            margin: 0 auto 15px auto;
            line-height: 1.6;

            border: 2px solid var(--glass-border);

            padding: 18px;
            margin: 15px auto;
            backdrop-filter: blur(10px);
            max-width: 600px;
            text-align: center;

        .formula {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-accent);

        .value-display {

            font-weight: 700;
            color: var(--text-accent);
            text-align: center;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);

        .content-card {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 18px;
            margin: 12px 0;
            backdrop-filter: blur(10px);
            transition: var(--transition);

        .content-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);

        .example-box {

            border: 2px solid rgba(67, 233, 123, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin: 12px 0;
        }

        .comparison-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
            align-items: stretch;
        }

        .comparison-grid .content-card {
            flex: 1 1 280px;
            min-width: 250px;
            max-width: 350px;
        }

        .quiz-option {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .quiz-option:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: var(--success-gradient);
            border-color: transparent;
        }

        .quiz-option.incorrect {
            background: var(--secondary-gradient);
            border-color: transparent;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--glass-bg);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--success-gradient);
            transition: width 0.5s ease;
        }

        .action-btn {
            background: var(--success-gradient);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin: 10px;

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(67, 233, 123, 0.4);
        }

        .highlight-text {
            color: var(--text-accent);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .calculation-step {
            background: rgba(79, 172, 254, 0.1);
            border-left: 4px solid #4facfe;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .factor-badge {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .step-number {
            display: inline-block;
            background: var(--accent-gradient);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: 700;
            margin-right: 8px;
        }

        .interactive-input {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 15px;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: center;
            width: 100%;
            margin: 8px 0;
        }

        .interactive-input:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
        }

        .glow-effect {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
</head>

    <div id="audio-control">
        <button id="mute-btn" class="control-btn">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="header">
        <h1>Factorization of Polynomials</h1>
        <p>Master polynomial factorization through interactive learning</p>
    </div>

            <button class="demo-btn" data-demo="factor-theorem">📖 Factor Theorem</button>
            <button class="demo-btn" data-demo="splitting-middle">✂️ Splitting Middle Term</button>

        </div>

    <script>
        let globalAudioEnabled = true;
        let currentTeacher = null;
        let currentDemo = null;
        let quizScore = 0;
        let currentQuizQuestion = 0;

        // Text-to-Speech Teacher
        class Teacher {
            constructor() {
                this.synthesis = window.speechSynthesis;
                this.isEnabled = globalAudioEnabled;
                this.currentUtterance = null;
            }

            speak(text) {
                if (!this.isEnabled || !this.synthesis) return;

                this.stop();

                this.currentUtterance = new SpeechSynthesisUtterance(text);
                this.currentUtterance.rate = 0.9;
                this.currentUtterance.pitch = 1;
                this.currentUtterance.volume = 1;

                const voices = this.synthesis.getVoices();
                const preferredVoice = voices.find(voice => 
                    voice.lang.startsWith('en') && voice.name.includes('Female')
                ) || voices.find(voice => voice.lang.startsWith('en')) || voices[0];

                if (preferredVoice) {
                    this.currentUtterance.voice = preferredVoice;
                }

                this.synthesis.speak(this.currentUtterance);
            }

            stop() {
                if (this.synthesis) {
                    this.synthesis.cancel();
                }
            }
        }

        function createNewTeacher() {
            if (currentTeacher) {
                currentTeacher.stop();
            }
            currentTeacher = new Teacher();
            return currentTeacher;
        }

        function transitionToNextStep(content) {
            const stageContent = document.getElementById('stage-content');
            stageContent.style.animation = 'fadeOut 0.3s ease-out';
            
            setTimeout(() => {
                stageContent.innerHTML = content;
                stageContent.style.animation = 'fadeIn 0.5s ease-out';
            }, 300);
        }

        function stopCurrentDemo() {
            if (currentTeacher) {
                currentTeacher.stop();
            }
        }

            const teacher = createNewTeacher();

                                    </p>
                                    <p style="color: #cbd5e0; font-size: 0.95rem; margin-top: 12px;">
                                        and vice versa
                                    </p>
                                </div>
                                <div style="margin-top: 20px; padding: 15px; background: rgba(79, 172, 254, 0.1); border-radius: 12px;">
                                    <h4 style="color: #4facfe; font-size: 1rem; margin-bottom: 10px;">Key Points:</h4>
                                    <p style="color: #e2e8f0; font-size: 0.9rem; line-height: 1.8;">

                                    </p>
                                </div>

                        <button class="action-btn" onclick="nextStep()">Continue →</button>

        // Interactive Demo
        function showInteractiveDemo() {
            stopCurrentDemo();
            const teacher = createNewTeacher();

            const content = `
                <h2 class="math-title" style="font-size: 1.4rem; margin-bottom: 10px;">Factor a Quadratic! 🎮</h2>
                <div style="width: 100%; max-width: 650px; padding: 0 15px;">
                    <div class="content-card" style="padding: 15px;">
                        <p style="font-size: 0.95rem; color: #e2e8f0; margin-bottom: 12px; text-align: center;">

                                <input type="number" id="coeff-a" class="interactive-input" 
                                       placeholder="a" 
                                       style="width: 80px; padding: 10px; font-size: 1rem;" />
                                <span style="font-size: 1.1rem; color: #fbbf24;">x² +</span>
                                <input type="number" id="coeff-b" class="interactive-input" 
                                       placeholder="b" 
                                       style="width: 80px; padding: 10px; font-size: 1rem;" />
                                <span style="font-size: 1.1rem; color: #fbbf24;">x +</span>
                                <input type="number" id="coeff-c" class="interactive-input" 
                                       placeholder="c" 
                                       style="width: 80px; padding: 10px; font-size: 1rem;" />
                            </div>
                            <p style="color: #cbd5e0; font-size: 0.8rem; text-align: center; margin-top: 8px;">
                                💡 Example: For 6x² + 17x + 5, enter a=6, b=17, c=5
                            </p>
                        </div>

                        <button class="action-btn" style="font-size: 1rem; padding: 12px 28px;" onclick="factorQuadratic()">🎯 Factor It!</button>
                        
                        <div id="factor-result" style="margin-top: 12px;"></div>
                    </div>
                </div>
            `;

            transitionToNextStep(content);

            window.factorQuadratic = function() {
                const a = parseInt(document.getElementById('coeff-a').value);
                const b = parseInt(document.getElementById('coeff-b').value);
                const c = parseInt(document.getElementById('coeff-c').value);

                if (isNaN(a) || isNaN(b) || isNaN(c)) {
                    teacher.speak("Please enter valid numbers for all coefficients!");
                    return;
                }

                if (a === 0) {
                    const result = `
                        <div class="content-card" style="padding: 15px; background: rgba(245, 87, 108, 0.2);">
                            <h3 style="color: #f5576c; font-size: 1.1rem; margin-bottom: 10px;">⚠️ Not a Quadratic</h3>
                            <p style="color: #e2e8f0; font-size: 0.9rem;">
                                When a = 0, this is not a quadratic polynomial!
                            </p>
                        </div>
                    `;
                    document.getElementById('factor-result').innerHTML = result;
                    teacher.speak("When a equals zero, this is not a quadratic polynomial!");
                    return;
                }

                // Find two numbers
                const product = a * c;
                const sum = b;
                let num1 = 0, num2 = 0;
                let found = false;

                for (let i = -Math.abs(product); i <= Math.abs(product); i++) {
                    if (i !== 0 && product % i === 0) {
                        const j = product / i;
                        if (i + j === sum) {
                            num1 = i;
                            num2 = j;
                            found = true;
                            break;
                        }
                    }
                }

                if (!found) {
                    const result = `
                        <div class="content-card" style="padding: 15px; background: rgba(245, 87, 108, 0.2);">
                            <h3 style="color: #f5576c; font-size: 1.1rem; margin-bottom: 10px;">❌ Not Factorable</h3>
                            <p style="color: #e2e8f0; font-size: 0.9rem;">
                                Cannot factor this quadratic using integers!
                            </p>
                        </div>
                    `;
                    document.getElementById('factor-result').innerHTML = result;
                    teacher.speak("This quadratic cannot be factored using integer values!");
                    return;
                }

                const result = `
                    <div class="content-card glow-effect" style="padding: 15px;">
                        <h3 style="color: #fbbf24; font-size: 1.1rem; margin-bottom: 10px;">Solution:</h3>
                        <div class="calculation-step" style="padding: 10px;">
                            <p style="color: #cbd5e0; font-size: 0.85rem; line-height: 1.5;">
                                For ${a}x² + ${b}x + ${c}<br>
                                Sum = ${sum}, Product = ${product}<br>
                                Numbers: ${num1} and ${num2}<br>
                                ${a}x² + ${num1}x + ${num2}x + ${c}
                            </p>
                        </div>
                        <div style="margin-top: 12px; padding: 12px; background: rgba(67, 233, 123, 0.2); border-radius: 10px;">
                            <p style="color: #43e97b; font-size: 1rem; text-align: center; font-weight: 600;">
                                ✓ Continue factoring by grouping!
                            </p>
                        </div>
                    </div>
                `;

                document.getElementById('factor-result').innerHTML = result;
                teacher.speak(`For ${a} x squared plus ${b} x plus ${c}, we found the numbers ${num1} and ${num2}. Now continue factoring by grouping!`);
            };

            setTimeout(() => {
                teacher.speak("Enter the coefficients of a quadratic polynomial, and I'll help you factor it using the splitting middle term method!");
            }, 500);
        }

                <h2 class="math-title">Welcome! ✨</h2>
                <div class="value-display">Interactive Learning</div>
                <div class="math-description">
                    Explore factorization of polynomials with stunning animations 
                    and interactive visualizations!
                </div>
                <div class="formula-box">
                    <p style="font-size: 1.1rem; color: #43e97b;">
                        Factor Theorem | Splitting Terms | Methods
                    </p>
                </div>
            `;

            transitionToNextStep(content);

            document.querySelectorAll('.demo-btn').forEach(btn => btn.classList.remove('active'));
            currentDemo = null;

            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome back! Choose any lesson to explore factorization of polynomials!");
            }, 500);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            const teacher = createNewTeacher();

            const initialContent = `
                <h2 class="math-title">Welcome! ✨</h2>
                <div class="value-display">Factorization of Polynomials</div>
                <div class="math-description">
                    Experience mathematics like never before! Master factorization 
                    techniques with stunning animations and interactive demos!
                </div>
                <div class="formula-box">
                    <p style="font-size: 1.1rem; color: #43e97b;">
                        Factor Theorem | Splitting Middle Term<br>
                        Using Factor Theorem | Examples
                    </p>
                </div>
            `;

            transitionToNextStep(initialContent);

            setTimeout(() => {
                teacher.speak("Welcome to Factorization of Polynomials! Discover powerful techniques to factor polynomials with amazing visualizations!");
            }, 500);

            // Button handlers
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;

                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'factor-theorem':
                            showFactorTheorem();
                            break;
                        case 'splitting-middle':
                            showSplittingMiddle();
                            break;
                        case 'using-theorem':
                            showUsingTheorem();
                            break;
                        case 'examples':
                            showExamples();
                            break;
                        case 'step-by-step':
                            showStepByStep();
                            break;
                        case 'interactive':
                            showInteractiveDemo();
                            break;
                        case 'quiz':
                            showQuiz();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });

            // Audio control
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);

                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }

                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });
        });
    </script>
</body>
</html>
