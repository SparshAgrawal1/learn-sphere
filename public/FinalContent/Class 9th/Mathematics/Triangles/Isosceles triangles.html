<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties of Isosceles Triangles - Interactive Learning</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --geometry-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --triangle-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-accent: #fbbf24;
            --shadow-primary: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 2rem;
            background: var(--triangle-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .demo-stage {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .stage-content {
            width: 100%;
            height: 100%;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .stage-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .demo-btn {
            padding: 12px 24px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .demo-btn.active {
            background: var(--triangle-gradient);
            color: white;
            border-color: transparent;
        }

        #audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--triangle-gradient);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-primary);
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.muted .unmute-icon { display: none; }
        .control-btn:not(.muted) .mute-icon { display: none; }

        .geometry-canvas {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .geometry-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--text-accent);
            text-align: center;
            font-weight: 700;
        }

        .geometry-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 800px;
            margin: 20px auto;
            line-height: 1.6;
        }

        .theorem-box {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            max-width: 700px;
            backdrop-filter: blur(10px);
        }

        .theorem-title {
            font-size: 1.3rem;
            color: var(--text-accent);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .theorem-content {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .step-container {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            margin: 15px 0;
            max-width: 700px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateX(-20px);
        }

        .step-number {
            font-size: 1.1rem;
            color: var(--text-accent);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .step-text {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .value-display {
            font-size: 1.5rem;
            color: var(--text-accent);
            font-weight: 700;
            margin: 15px 0;
            padding: 12px 25px;
            background: var(--glass-bg);
            border-radius: 30px;
            border: 2px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .threejs-container {
            width: 100%;
            max-width: 700px;
            height: 450px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--success-gradient);
            width: 0%;
            transition: width 0.5s ease;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
        }

        .question-card {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }

        .question-text {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .option-btn {
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: var(--success-gradient);
            border-color: transparent;
            color: white;
        }

        .option-btn.incorrect {
            background: var(--secondary-gradient);
            border-color: transparent;
            color: white;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            display: none;
        }

        .feedback-box.correct {
            background: rgba(67, 233, 123, 0.2);
            border: 2px solid rgba(67, 233, 123, 0.5);
            color: #43e97b;
            display: block;
        }

        .feedback-box.incorrect {
            background: rgba(245, 87, 108, 0.2);
            border: 2px solid rgba(245, 87, 108, 0.5);
            color: #f5576c;
            display: block;
        }

        .next-btn {
            padding: 12px 30px;
            background: var(--triangle-gradient);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .score-display {
            font-size: 1.2rem;
            color: var(--text-accent);
            margin: 15px 0;
            font-weight: 600;
        }

        .chart-container {
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 20px auto;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .geometry-title {
                font-size: 1.4rem;
            }

            .threejs-container {
                height: 350px;
            }

            .controls {
                gap: 8px;
            }

            .demo-btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Properties of Isosceles Triangles 📐</h1>
        <p>Interactive Geometry Learning | Theorems 7.2 & 7.3</p>
    </div>

    <div id="audio-control">
        <button id="mute-btn" class="control-btn">
            <span class="unmute-icon">🔊</span>
            <span class="mute-icon">🔇</span>
        </button>
    </div>

    <div class="main-container">
        <div class="demo-stage" id="demo-stage">
            <!-- Content will be dynamically inserted here -->
        </div>

        <div class="controls">
            <button class="demo-btn" data-demo="complete">📚 Complete Lesson</button>
            <button class="demo-btn" data-demo="introduction">🔰 Introduction</button>
            <button class="demo-btn" data-demo="theorem72">📐 Theorem 7.2</button>
            <button class="demo-btn" data-demo="theorem73">📏 Theorem 7.3</button>
            <button class="demo-btn" data-demo="example4">💡 Example 4</button>
            <button class="demo-btn" data-demo="example5">💡 Example 5</button>
            <button class="demo-btn" data-demo="example6">💡 Example 6</button>
            <button class="demo-btn" data-demo="quiz">🎯 Quiz</button>
            <button class="demo-btn" data-demo="reset">🔄 Reset</button>
        </div>
    </div>

    <script>
        // ============================================
        // GLOBAL VARIABLES
        // ============================================

        let globalAudioEnabled = true;
        let currentTeacher = null;
        let currentDemo = null;
        let threeJsScenes = [];
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

        // ============================================
        // TEACHER/NARRATOR SYSTEM
        // ============================================

        function createNewTeacher() {
            if (currentTeacher) {
                currentTeacher.stop();
            }

            const teacher = {
                isEnabled: globalAudioEnabled,
                isSpeaking: false,
                currentUtterance: null,

                speak: function(text) {
                    return new Promise((resolve) => {
                        if (!this.isEnabled) {
                            resolve();
                            return;
                        }

                        this.stop();

                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.rate = 0.9;
                        utterance.pitch = 1.0;
                        utterance.volume = 1.0;

                        utterance.onend = () => {
                            this.isSpeaking = false;
                            this.currentUtterance = null;
                            resolve();
                        };

                        utterance.onerror = () => {
                            this.isSpeaking = false;
                            this.currentUtterance = null;
                            resolve();
                        };

                        this.currentUtterance = utterance;
                        this.isSpeaking = true;
                        window.speechSynthesis.speak(utterance);
                    });
                },

                stop: function() {
                    if (this.isSpeaking) {
                        window.speechSynthesis.cancel();
                        this.isSpeaking = false;
                        this.currentUtterance = null;
                    }
                }
            };

            currentTeacher = teacher;
            return teacher;
        }

        // ============================================
        // THREE.JS HELPER FUNCTIONS
        // ============================================

        function createThreeJsScene(container) {
            const scene = new THREE.Scene();
            const width = container.clientWidth;
            const height = container.clientHeight;

            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 12;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            const sceneData = { scene, camera, renderer, container };
            threeJsScenes.push(sceneData);
            return sceneData;
        }

        function drawLine(sceneData, x1, y1, x2, y2, color, linewidth = 2) {
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: linewidth });
            const points = [];
            points.push(new THREE.Vector3(x1, y1, 0));
            points.push(new THREE.Vector3(x2, y2, 0));
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            sceneData.scene.add(line);
            return line;
        }

        function drawTriangle(sceneData, x1, y1, x2, y2, x3, y3, color, opacity = 0.3) {
            const shape = new THREE.Shape();
            shape.moveTo(x1, y1);
            shape.lineTo(x2, y2);
            shape.lineTo(x3, y3);
            shape.lineTo(x1, y1);

            const geometry = new THREE.ShapeGeometry(shape);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            sceneData.scene.add(mesh);
            return mesh;
        }

        function drawPoint(sceneData, x, y, color, size = 0.3) {
            const geometry = new THREE.SphereGeometry(size, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, 0);
            sceneData.scene.add(sphere);
            return sphere;
        }

        function drawLabel(sceneData, text, x, y, color = '#ffffff') {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;

            context.fillStyle = color;
            context.font = 'Bold 42px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 64, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, 0);
            sprite.scale.set(2, 1, 1);
            sceneData.scene.add(sprite);
            return sprite;
        }

        function drawArc(sceneData, x, y, radius, startAngle, endAngle, color) {
            const curve = new THREE.EllipseCurve(
                x, y,
                radius, radius,
                startAngle, endAngle,
                false,
                0
            );

            const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const arc = new THREE.Line(geometry, material);
            sceneData.scene.add(arc);
            return arc;
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function createStageContent() {
            const stage = document.getElementById('demo-stage');
            stage.innerHTML = '';
            
            const content = document.createElement('div');
            content.className = 'stage-content active';
            stage.appendChild(content);
            return content;
        }

        function stopCurrentDemo() {
            if (currentTeacher) {
                currentTeacher.stop();
            }

            threeJsScenes.forEach(sceneData => {
                if (sceneData.renderer && sceneData.renderer.domElement) {
                    sceneData.renderer.domElement.remove();
                }
            });
            threeJsScenes = [];
        }

        function animateStep(element, delay = 0) {
            gsap.to(element, {
                opacity: 1,
                x: 0,
                duration: 0.6,
                delay: delay,
                ease: "power2.out"
            });
        }

        // ============================================
        // COMPLETE LESSON
        // ============================================

        async function showCompleteLesson() {
            stopCurrentDemo();
            const teacher = createNewTeacher();

            const content = createStageContent();
            content.innerHTML = `
                <h2 class="geometry-title">Complete Lesson: Properties of Isosceles Triangles 📐</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="lesson-progress"></div>
                </div>
                <div class="value-display">Follow along with the full interactive lesson!</div>
                <div id="lesson-content"></div>
            `;

            await teacher.speak("Welcome to the complete lesson on Properties of Isosceles Triangles! Let's explore Theorems seven point two and seven point three together!");

            const lessons = [
                { func: showIntroductionContent, name: 'Introduction' },
                { func: showTheorem72Content, name: 'Theorem 7.2' },
                { func: showTheorem73Content, name: 'Theorem 7.3' },
                { func: showExample4Content, name: 'Example 4' },
                { func: showExample5Content, name: 'Example 5' },
                { func: showExample6Content, name: 'Example 6' }
            ];

            const lessonContainer = document.getElementById('lesson-content');
            const progressBar = document.getElementById('lesson-progress');

            for (let i = 0; i < lessons.length; i++) {
                const progress = ((i + 1) / lessons.length) * 100;
                progressBar.style.width = `${progress}%`;

                lessonContainer.innerHTML = '';
                await lessons[i].func(lessonContainer, teacher);
                await wait(2000);
            }

            await teacher.speak("Congratulations! You've completed the full lesson on isosceles triangles. Now test your knowledge with the quiz!");
        }

        // ============================================
        // INTRODUCTION
        // ============================================

        async function showIntroduction() {
            stopCurrentDemo();
            const teacher = createNewTeacher();
            const content = createStageContent();
            await showIntroductionContent(content, teacher);
        }

        async function showIntroductionContent(container, teacher) {
            container.innerHTML = `
                <h2 class="geometry-title">What is an Isosceles Triangle? 📐</h2>
                <div class="geometry-description">
                    A triangle in which two sides are equal is called an isosceles triangle.
                </div>
                <div class="threejs-container" id="intro-threejs"></div>
                <div class="theorem-box">
                    <div class="theorem-title">Definition</div>
                    <div class="theorem-content">
                        In △ABC, if AB = AC, then △ABC is an isosceles triangle.<br><br>
                        <strong>Key Property:</strong> The angles opposite to the equal sides are also equal!
                    </div>
                </div>
            `;

            await wait(300);

            const threeContainer = document.getElementById('intro-threejs');
            if (threeContainer) {
                const sceneData = createThreeJsScene(threeContainer);

                // Draw isosceles triangle
                const triangle = drawTriangle(sceneData, 0, 3, -3, -2, 3, -2, 0x4facfe, 0.4);
                triangle.scale.set(0, 0, 0);

                // Draw edges with labels
                const line1 = drawLine(sceneData, 0, 3, -3, -2, 0xf5576c, 3);
                const line2 = drawLine(sceneData, 0, 3, 3, -2, 0xf5576c, 3);
                const line3 = drawLine(sceneData, -3, -2, 3, -2, 0x43e97b, 3);

                line1.scale.x = 0;
                line2.scale.x = 0;
                line3.scale.x = 0;

                // Draw vertices
                const pointA = drawPoint(sceneData, 0, 3, 0xfbbf24, 0.3);
                const pointB = drawPoint(sceneData, -3, -2, 0xfbbf24, 0.3);
                const pointC = drawPoint(sceneData, 3, -2, 0xfbbf24, 0.3);

                pointA.scale.set(0, 0, 0);
                pointB.scale.set(0, 0, 0);
                pointC.scale.set(0, 0, 0);

                // Labels
                drawLabel(sceneData, 'A', 0, 3.8, '#fbbf24');
                drawLabel(sceneData, 'B', -3.8, -2, '#fbbf24');
                drawLabel(sceneData, 'C', 3.8, -2, '#fbbf24');

                await teacher.speak("Let's start with the basics. An isosceles triangle is a triangle where two sides are equal.");

                // Animate triangle appearance
                gsap.to(triangle.scale, { x: 1, y: 1, z: 1, duration: 1, ease: "back.out(1.7)" });
                await wait(1000);

                await teacher.speak("In triangle A B C, sides A B and A C are equal, making it an isosceles triangle.");

                // Animate equal sides
                gsap.to(line1.scale, { x: 1, duration: 0.8, ease: "power2.out" });
                await wait(400);
                gsap.to(line2.scale, { x: 1, duration: 0.8, ease: "power2.out" });
                await wait(1000);

                await teacher.speak("The base B C is the third side.");
                gsap.to(line3.scale, { x: 1, duration: 0.8, ease: "power2.out" });
                await wait(1000);

                // Animate vertices
                gsap.to(pointA.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "back.out(1.7)" });
                await wait(200);
                gsap.to(pointB.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "back.out(1.7)" });
                await wait(200);
                gsap.to(pointC.scale, { x: 1, y: 1, z: 1, duration: 0.5, ease: "back.out(1.7)" });

                await teacher.speak("Here's an interesting fact: the angles opposite to equal sides are also equal! This is what Theorem seven point two tells us.");

                // Draw angle markers
                drawArc(sceneData, -3, -2, 0.8, 0, Math.PI / 6, 0xfbbf24);
                drawArc(sceneData, 3, -2, 0.8, Math.PI * 5 / 6, Math.PI, 0xfbbf24);
                await wait(1500);
            }
        }

        // ============================================
        // THEOREM 7.2
        // ============================================

        async function showTheorem72() {
            stopCurrentDemo();
            const teacher = createNewTeacher();
            const content = createStageContent();
            await showTheorem72Content(content, teacher);
        }

        async function showTheorem72Content(container, teacher) {
            container.innerHTML = `

                ],

                options: [
                    "90°",
                    "45°",

                ],
                correct: 2,
                explanation: "Since all angles are equal and sum to 180°, each angle = 180°/3 = 60°."
            },
            {
                question: "If in △ABC, the bisector of ∠A is perpendicular to BC, what can we conclude?",
                options: [
                    "△ABC is a right triangle",
                    "△ABC is an isosceles triangle",
                    "△ABC is an equilateral triangle",
                    "BC is the longest side"
                ],
                correct: 1,
                explanation: "When the angle bisector from a vertex is perpendicular to the opposite side, the triangle is isosceles."
            },
            {
                question: "Which congruence rule is most commonly used to prove theorems about isosceles triangles?",
                options: [
                    "SSS",
                    "SAS",
                    "ASA",
                    "RHS"
                ],
                correct: 1,
                explanation: "SAS (Side-Angle-Side) is commonly used because we often have two equal sides and the included angle."
            },
            {
                question: "In △ABC with AB = AC, if E and F are midpoints of AB and AC respectively, what is true?",
                options: [
                    "BE = CF",
                    "BF = CE",
                    "EF = BC",
                    "AE = AF only"
                ],
                correct: 1,
                explanation: "By proving △ABF ≅ △ACE using SAS, we get BF = CE."
            },
            {
                question: "What does CPCT stand for?",
                options: [
                    "Common Parts of Congruent Triangles",
                    "Corresponding Parts of Congruent Triangles",
                    "Calculated Parts of Congruent Triangles",
                    "Correct Proofs of Congruent Triangles"
                ],
                correct: 1,
                explanation: "CPCT stands for Corresponding Parts of Congruent Triangles."

        let quizState = {
            currentQuestion: 0,
            score: 0,
            answered: false
        };

        async function showQuiz() {
            stopCurrentDemo();
            const teacher = createNewTeacher();

            quizState = {
                currentQuestion: 0,
                score: 0,
                answered: false
            };

            const content = createStageContent();
            content.innerHTML = `
                <h2 class="geometry-title">Quiz Time! 🎯</h2>
                <div class="score-display">Score: <span id="quiz-score">0</span>/${quizData.length}</div>
                <div class="quiz-container" id="quiz-container"></div>
            `;

            await teacher.speak("Time to test your knowledge! Let's see how well you understand the properties of isosceles triangles!");
            await wait(1000);

            displayQuestion();

            async function displayQuestion() {
                if (quizState.currentQuestion >= quizData.length) {
                    await showResults();
                    return;
                }

                const q = quizData[quizState.currentQuestion];
                const container = document.getElementById('quiz-container');
                quizState.answered = false;

                container.innerHTML = `
                    <div class="question-card">
                        <div class="value-display">Question ${quizState.currentQuestion + 1}/${quizData.length}</div>
                        <div class="question-text">${q.question}</div>
                        <div id="options-container"></div>
                        <div id="feedback" class="feedback-box"></div>
                        <button id="next-btn" class="next-btn" style="display: none;">Next Question →</button>
                    </div>
                `;

                const optionsContainer = document.getElementById('options-container');
                q.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = () => selectAnswer(index);
                    optionsContainer.appendChild(btn);
                });

                await teacher.speak(q.question);
            }

            async function selectAnswer(selectedIndex) {
                if (quizState.answered) return;

                quizState.answered = true;
                const q = quizData[quizState.currentQuestion];
                const buttons = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');
                const nextBtn = document.getElementById('next-btn');

                buttons.forEach((btn, index) => {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.classList.add('correct');
                    } else if (index === selectedIndex && index !== q.correct) {
                        btn.classList.add('incorrect');
                    }
                });

                const isCorrect = selectedIndex === q.correct;

                if (isCorrect) {
                    quizState.score++;
                    document.getElementById('quiz-score').textContent = quizState.score;
                    feedback.className = 'feedback-box correct';
                    feedback.innerHTML = `
                        <strong>✓ Correct!</strong><br>
                        ${q.explanation}
                    `;
                    await teacher.speak("Correct! " + q.explanation);
                } else {
                    feedback.className = 'feedback-box incorrect';
                    feedback.innerHTML = `
                        <strong>✗ Incorrect</strong><br>
                        The correct answer is: ${q.options[q.correct]}<br><br>
                        ${q.explanation}
                    `;
                    await teacher.speak("Not quite right. " + q.explanation);
                }

                nextBtn.style.display = 'block';
                nextBtn.onclick = async () => {
                    quizState.currentQuestion++;
                    await wait(300);
                    displayQuestion();
                };
            }

            async function showResults() {
                const container = document.getElementById('quiz-container');
                const percentage = (quizState.score / quizData.length) * 100;
                let message = '';

                if (percentage >= 90) {
                    message = 'Outstanding! You have mastered isosceles triangles!';
                } else if (percentage >= 70) {
                    message = 'Great job! You have a solid understanding!';
                } else if (percentage >= 50) {
                    message = 'Good effort! Review the material and try again!';
                } else {
                    message = 'Keep practicing! Review the lessons and take the quiz again!';
                }

                container.innerHTML = `
                    <div class="question-card">
                        <h3 class="geometry-title">Quiz Complete! 🎉</h3>
                        <div style="text-align: center; margin: 30px 0;">
                            <div class="value-display" style="display: inline-block;">
                                <div style="font-size: 2rem; font-weight: bold;">
                                    ${quizState.score}/${quizData.length}
                                </div>
                                <div style="font-size: 1.2rem; margin-top: 10px;">
                                    ${percentage.toFixed(0)}%
                                </div>
                            </div>
                        </div>

                        <div class="chart-container" style="margin-top: 30px;">
                            <canvas id="results-chart"></canvas>
                        </div>

                        <div class="theorem-box" style="margin-top: 30px;">
                            <div class="theorem-content" style="text-align: center;">
                                ${message}
                            </div>
                        </div>
                    </div>
                `;

                await wait(500);

                // Create results chart
                const ctx = document.getElementById('results-chart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Correct', 'Incorrect'],
                        datasets: [{
                            data: [quizState.score, quizData.length - quizState.score],
                            backgroundColor: [
                                'rgba(67, 233, 123, 0.8)',
                                'rgba(245, 87, 108, 0.8)'
                            ],
                            borderColor: [
                                'rgba(67, 233, 123, 1)',
                                'rgba(245, 87, 108, 1)'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#ffffff',
                                    font: { size: 16 }
                                }
                            }
                        }
                    }
                });

                await teacher.speak(`Quiz complete! You scored ${quizState.score} out of ${quizData.length}. ${message}`);
            }
        }

        // ============================================
        // RESET FUNCTION
        // ============================================

        function resetApplication() {
            stopCurrentDemo();

            const content = createStageContent();
            content.innerHTML = `
                <h2 class="geometry-title">Properties of Isosceles Triangles 📐</h2>
                <div class="value-display">Interactive Geometry Learning</div>
                <p class="geometry-description">
                    Explore Theorems 7.2 and 7.3 and discover the fascinating properties of isosceles triangles!
                    Choose a lesson below to begin your journey!
                </p>
                <div class="threejs-container" id="welcome-threejs"></div>
            `;

            setTimeout(() => {
                const container = document.getElementById('welcome-threejs');
                if (container) {
                    const sceneData = createThreeJsScene(container);
                    
                    // Create animated isosceles triangle
                    const triangle = drawTriangle(sceneData, 0, 4, -4, -2.5, 4, -2.5, 0x4facfe, 0.4);
                    triangle.scale.set(0, 0, 0);

                    // Draw edges
                    const line1 = drawLine(sceneData, 0, 4, -4, -2.5, 0xf5576c, 4);
                    const line2 = drawLine(sceneData, 0, 4, 4, -2.5, 0xf5576c, 4);
                    const line3 = drawLine(sceneData, -4, -2.5, 4, -2.5, 0x43e97b, 4);

                    line1.scale.x = 0;
                    line2.scale.x = 0;
                    line3.scale.x = 0;

                    // Animate
                    gsap.to(triangle.scale, {
                        x: 1, y: 1, z: 1,
                        duration: 1.2,
                        delay: 0.3,
                        ease: "back.out(1.7)"
                    });

                    gsap.to(line1.scale, { x: 1, duration: 1, delay: 0.8, ease: "power2.out" });
                    gsap.to(line2.scale, { x: 1, duration: 1, delay: 1.2, ease: "power2.out" });
                    gsap.to(line3.scale, { x: 1, duration: 1, delay: 1.6, ease: "power2.out" });

                    // Draw vertices
                    const pointA = drawPoint(sceneData, 0, 4, 0xfbbf24, 0.4);
                    const pointB = drawPoint(sceneData, -4, -2.5, 0xfbbf24, 0.4);
                    const pointC = drawPoint(sceneData, 4, -2.5, 0xfbbf24, 0.4);

                    pointA.scale.set(0, 0, 0);
                    pointB.scale.set(0, 0, 0);
                    pointC.scale.set(0, 0, 0);

                    gsap.to(pointA.scale, { x: 1, y: 1, z: 1, duration: 0.5, delay: 2, ease: "back.out(1.7)" });
                    gsap.to(pointB.scale, { x: 1, y: 1, z: 1, duration: 0.5, delay: 2.2, ease: "back.out(1.7)" });
                    gsap.to(pointC.scale, { x: 1, y: 1, z: 1, duration: 0.5, delay: 2.4, ease: "back.out(1.7)" });

                    // Labels
                    drawLabel(sceneData, 'A', 0, 5, '#fbbf24');
                    drawLabel(sceneData, 'B', -5, -2.5, '#fbbf24');
                    drawLabel(sceneData, 'C', 5, -2.5, '#fbbf24');
                }
            }, 100);

            document.querySelectorAll('.demo-btn').forEach(btn => btn.classList.remove('active'));
            currentDemo = null;

            const teacher = createNewTeacher();
            setTimeout(() => {
                teacher.speak("Welcome to Properties of Isosceles Triangles! Explore the amazing theorems and examples with stunning three D animations!");
            }, 500);
        }

                teacher.speak("Welcome to Properties of Isosceles Triangles! Explore the amazing theorems and examples with stunning three D animations!");
            }, 500);

            // Demo button event handlers
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const demo = this.getAttribute('data-demo');
                    currentDemo = demo;
                    switch(demo) {
                        case 'complete':
                            showCompleteLesson();
                            break;
                        case 'introduction':
                            showIntroduction();
                            break;
                        case 'theorem72':
                            showTheorem72();

                        case 'example4':
                            showExample4();
                            break;
                        case 'example5':
                            showExample5();

                        case 'example6':
                            showExample6();
                            break;
                        case 'quiz':
                            showQuiz();
                            break;
                        case 'reset':
                            resetApplication();
                            break;
                    }
                });
            });

            // Audio control button
            document.getElementById('mute-btn').addEventListener('click', function() {
                globalAudioEnabled = !globalAudioEnabled;
                this.classList.toggle('muted', !globalAudioEnabled);
                if (!globalAudioEnabled && currentTeacher) {
                    currentTeacher.stop();
                }
                if (currentTeacher) {
                    currentTeacher.isEnabled = globalAudioEnabled;
                }
            });

            // Window resize handler for Three.js scenes
            window.addEventListener('resize', () => {
                threeJsScenes.forEach(sceneData => {
                    const container = sceneData.renderer.domElement.parentElement;
                    if (container) {
                        sceneData.camera.aspect = container.clientWidth / container.clientHeight;
                        sceneData.camera.updateProjectionMatrix();
                        sceneData.renderer.setSize(container.clientWidth, container.clientHeight);
                    }
                });
            });
        });
    </script>
